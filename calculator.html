<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة وقت الخروج (التصاريح)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        .logo {
            display: block;
            margin: 0 auto 15px auto;
            max-width: 120px;
            height: auto;
            border-radius: 8px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
            font-size: 13px;
        }
        input[type="time"], input[type="number"], select {
            width: 100%;
            max-width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            text-align: center;
            margin-top: 3px;
            margin-bottom: 10px;
            display: block;
            background-color: #fff;
        }
        .permit-group {
            display: flex;
            gap: 10px;
        }
        .permit-group .form-group {
            flex: 1;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1f618d;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f6f3;
            border-right: 5px solid #1abc9c;
            border-radius: 4px;
            display: none;
            text-align: right;
        }
        .result-box p {
            margin: 8px 0;
            font-size: 14px;
            line-height: 1.6;
        }
        .highlight {
            font-weight: bold;
            color: #d35400;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="IMG_3974.jpeg" class="logo" alt="شعار">
    <h2>حاسبة وقت الخروج (التصاريح)</h2>
    
    <div class="form-group">
        <label for="calcType">طريقة الحساب:</label>
        <select id="calcType" onchange="toggleDaysMode()">
            <option value="1">يوم واحد</option>
            <option value="2">يومين (شفت يمر بمنتصف الليل)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="startTime">بداية الشفت (متى تداوم):</label>
        <input type="time" id="startTime" required>
    </div>

    <div class="form-group" id="endTimeGroup">
        <label for="endTime">نهاية الشفت المعتاد:</label>
        <input type="time" id="endTime">
    </div>

    <div class="form-group">
        <label>رصيد التصريح المراد استخدامه:</label>
        <div class="permit-group">
            <div class="form-group">
                <input type="number" id="permitHours" placeholder="ساعات (مثال: 2)" min="0" max="24" value="0">
            </div>
            <div class="form-group">
                <input type="number" id="permitMinutes" placeholder="دقائق (مثال: 30)" min="0" max="59" value="0">
            </div>
        </div>
    </div>

    <button onclick="calculateExitTime()">احسب وقت الخروج</button>

    <div class="result-box" id="resultBox">
        <p id="resultText"></p>
    </div>
</div>

<script>
function toggleDaysMode() {
    const type = document.getElementById('calcType').value;
    const endTimeGroup = document.getElementById('endTimeGroup');
    // إذا اختار يومين، الشفت يبدأ و ينتهي في اليوم التالي افتراضياً بناءً على 8 ساعات دوام، فنخفي خانة نهاية الشفت المعتاد لتبسيط الحساب
    if (type === '2') {
        endTimeGroup.style.display = 'none';
    } else {
        endTimeGroup.style.display = 'block';
    }
}

function calculateExitTime() {
    const type = document.getElementById('calcType').value;
    const startTimeVal = document.getElementById('startTime').value;
    const pHours = parseInt(document.getElementById('permitHours').value) || 0;
    const pMinutes = parseInt(document.getElementById('permitMinutes').value) || 0;
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');

    if (!startTimeVal) {
        alert('الرجاء إدخال وقت بداية الشفت على الأقل');
        return;
    }

    // تحويل وقت البداية إلى دقائق من بداية اليوم
    const [startH, startM] = startTimeVal.split(':').map(Number);
    const startTotalMins = startH * 60 + startM;
    const permitTotalMins = pHours * 60 + pMinutes;

    if (type === '1') {
        // نظام يوم واحد (الوضع القديم)
        const endTimeVal = document.getElementById('endTime').value;
        if (!endTimeVal) {
            alert('الرجاء إدخال نهاية الشفت المعتاد');
            return;
        }
        const [endH, endM] = endTimeVal.split(':').map(Number);
        let endTotalMins = endH * 60 + endM;
        
        // إذا كان وقت النهاية أقل من البداية (يعني عبر منتصف الليل في نظام يوم واحد)
        if (endTotalMins <= startTotalMins) {
            endTotalMins += 24 * 60;
        }

        const totalShiftMins = endTotalMins - startTotalMins;
        const actualWorkMins = totalShiftMins - permitTotalMins;
        const exitTotalMins = startTotalMins + actualWorkMins;

        const exitH = Math.floor((exitTotalMins / 60) % 24);
        const exitM = exitTotalMins % 60;
        const formattedExit = String(exitH).padStart(2, '0') + ':' + String(exitM).padStart(2, '0');

        const actH = Math.floor(actualWorkMins / 60);
        const actM = actualWorkMins % 60;

        resultText.innerHTML = `
            وقت الخروج بعد خصم التصريح: <span class="highlight">${formattedExit}</span><br>
            ساعات العمل الفعلية للدوام: <span class="highlight">${actH} ساعة و ${actM} دقيقة</span>
        `;
    } else {
        // نظام يومين (اليوم الثاني 8 ساعات كاملة، واليوم الأول الساعات المتبقية)
        // إجمالي الشفت ليومين = 16 ساعة افتراضياً (8 لكل يوم) أو حسب المتداول
        // اليوم الأخير 8 ساعات كاملة (480 دقيقة)، واليوم الأول الباقي من إجمالي الساعات
        // فلنحسب إجمالي الشفت الطبيعي ليومين (مثلاً 16 ساعة = 960 دقيقة)
        const totalStandardMins = 16 * 60; 
        const actualWorkMins = totalStandardMins - permitTotalMins;
        
        // اليوم الأخير يتطلب دوام 8 ساعات كاملة (480 دقيقة)
        // إذن ساعات اليوم الأول الفعلية = إجمالي العمل الفعلي - 480 دقيقة
        const day1WorkMins = actualWorkMins - 480;

        // وقت الخروج في اليوم الأول = وقت البداية + ساعات العمل الفعلية في اليوم الأول
        const exitTotalMins = startTotalMins + day1WorkMins;
        const exitH = Math.floor((exitTotalMins / 60) % 24);
        const exitM = exitTotalMins % 60;
        const formattedExit = String(exitH).padStart(2, '0') + ':' + String(exitM).padStart(2, '0');

        const actH = Math.floor(actualWorkMins / 60);
        const actM = actualWorkMins % 60;

        const d1H = Math.floor(day1WorkMins / 60);
        const d1M = day1WorkMins % 60;

        resultText.innerHTML = `
            وقت الخروج في اليوم الأول: <span class="highlight">${formattedExit}</span><br>
            ساعات العمل في اليوم الأول: <span class="highlight">${d1H} ساعة و ${d1M} دقيقة</span><br>
            ساعات العمل في اليوم الثاني: <span class="highlight">8 ساعات كاملة</span><br>
            إجمالي ساعات العمل الفعلي: <span class="highlight">${actH} ساعة و ${actM} دقيقة</span>
        `;
    }

    resultBox.style.display = 'block';
}
</script>

</body>
</html>
