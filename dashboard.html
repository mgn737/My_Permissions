<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة التصاريح</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h2 { color: #2c3e50; font-size: 18px; margin: 0; }
        .back-btn, .logout-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
        }
        .back-btn { background-color: #2980b9; }
        
        .card-stats {
            background-color: #e8f6f3;
            border: 1px solid #1abc9c;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .card-stats h3 { margin: 0 0 5px 0; color: #16a085; font-size: 15px; }
        .card-stats span { font-size: 22px; font-weight: bold; color: #2c3e50; }

        .suggestion-box {
            background-color: #fef9e7;
            border: 2px solid #f39c12;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .suggestion-box p { margin: 0; color: #d35400; font-weight: bold; font-size: 14px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; text-align: right; }
        select, input {
            width: 100%;
            padding: 9px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #f0f2f5;
            text-align: right;
        }
        .note-text {
            font-size: 11px;
            color: #7f8c8d;
            margin-top: 4px;
            display: block;
            text-align: right;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .action-btn:hover { background-color: #219653; }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            font-size: 12px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th { background-color: #f4f7f6; color: #2c3e50; }
        .edit-btn {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <a href="home.html" class="back-btn">الرئيسية</a>
        <h2>إدارة التصاريح الشهرية</h2>
        <button class="logout-btn" onclick="logout()">خروج</button>
    </div>

    <!-- رصيد الساعات -->
    <div class="card-stats">
        <h3>رصيد التصاريح المتاحة هذا الشهر</h3>
        <span id="remainingHours">22</span> ساعة
    </div>

    <!-- صندوق الاقتراح الذكي -->
    <div class="suggestion-box" id="suggestionBox">
        <p id="suggestionText"></p>
    </div>

    <!-- اختيار الشفت -->
    <div class="form-group">
        <label>فترة العمل (الشفت):</label>
        <select id="shiftSelect" onchange="toggleCustomShift()">
            <option value="07:00-15:00">الفترة الأولى (7 ص - 3 م)</option>
            <option value="05:00-13:00">الفترة الثانية (5 ص - 1 م)</option>
            <option value="22:00-06:00">الفترة الثالثة (10 م - 6 ص)</option>
            <option value="00:00-08:00">الفترة الرابعة (12 ص - 8 ص)</option>
            <option value="custom">مخصص (تحديد يدوي)</option>
        </select>
    </div>

    <!-- شفت مخصص -->
    <div id="customShiftBox" style="display: none; gap: 10px; display: flex; margin-bottom: 15px;">
        <div style="flex:1;"><label>بداية:</label><input type="time" id="customStart"></div>
        <div style="flex:1;"><label>نهاية:</label><input type="time" id="customEnd"></div>
    </div>

    <!-- إدخال مرن: إما عدد الساعات مباشرة أو وقت الخروج باليوم والساعة -->
    <div class="form-group">
        <label>إدخال الاستئذان (اختر إحدى الطريقتين):</label>
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <input type="number" id="permitHoursInput" placeholder="عدد الساعات (مثال: 2)" min="0.5" max="22" step="0.5">
                <span class="note-text">أدخل عدد الساعات مباشرة</span>
            </div>
            <div style="flex: 1;">
                <input type="time" id="exitTimeInput">
                <span class="note-text">أو وقت الخروج بالمنبه</span>
            </div>
        </div>
    </div>

    <button class="action-btn" onclick="addPermit()">حفظ وتطبيق التصريح</button>

    <!-- جدول السجل -->
    <h3 style="margin-top: 25px; font-size: 15px; color: #2c3e50;">سجل التصاريح لهذا الشهر</h3>
    <table>
        <thead>
            <tr>
                <th>اليوم والتاريخ</th>
                <th>الساعات</th>
                <th>تعديل</th>
            </tr>
        </thead>
        <tbody id="permitsTableBody">
            <!-- يُعبأ برمجياً -->
        </tbody>
    </table>
</div>

<script>
if (localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = 'login.html';
}

function logout() {
    localStorage.removeItem('isLoggedIn');
    window.location.href = 'login.html';
}

function toggleCustomShift() {
    const val = document.getElementById('shiftSelect').value;
    document.getElementById('customShiftBox').style.display = (val === 'custom') ? 'flex' : 'none';
}

function checkMonthlyReset() {
    const now = new Date();
    const currentMonth = now.getMonth();
    const storedMonth = localStorage.getItem('savedMonth');

    if (storedMonth === null || parseInt(storedMonth) !== currentMonth) {
        localStorage.setItem('savedMonth', currentMonth);
        localStorage.setItem('remainingHours', '22');
        localStorage.setItem('permitsList', JSON.stringify([]));
    }
}

checkMonthlyReset();

let remainingHours = parseFloat(localStorage.getItem('remainingHours')) || 22;
let permitsList = JSON.parse(localStorage.getItem('permitsList')) || [];

function updateUI() {
    document.getElementById('remainingHours').innerText = remainingHours;
    localStorage.setItem('remainingHours', remainingHours);
    localStorage.setItem('permitsList', JSON.stringify(permitsList));

    const tbody = document.getElementById('permitsTableBody');
    tbody.innerHTML = '';
    permitsList.forEach((p, index) => {
        tbody.innerHTML += `
            <tr>
                <td>${p.date}</td>
                <td>${p.hours} ساعات</td>
                <td><button class="edit-btn" onclick="editPermit(${index})">✏️</button></td>
            </tr>
        `;
    });

    const suggestionBox = document.getElementById('suggestionBox');
    const suggestionText = document.getElementById('suggestionText');
    
    if (remainingHours < 8 && remainingHours > 0) {
        suggestionBox.style.display = 'block';
        suggestionText.innerHTML = `⚠️ رصيدك أقل من 8 ساعات (${remainingHours} س متبقية). يمكنك تنظيم أوقات خروجك بناءً على الرصيد المتبقي!`;
    } else {
        suggestionBox.style.display = 'none';
    }
}

function getShiftStartTime() {
    const shiftVal = document.getElementById('shiftSelect').value;
    if(shiftVal !== 'custom') {
        return shiftVal.split('-')[0];
    } else {
        return document.getElementById('customStart').value || "07:00";
    }
}

function addPermit() {
    let hoursInput = parseFloat(document.getElementById('permitHoursInput').value);
    const exitTime = document.getElementById('exitTimeInput').value;

    // إذا لم يدخل الساعات، ولكن أخل وقت الخروج، نقوم بحساب الفارق تلقائياً
    if ((isNaN(hoursInput) || hoursInput <= 0) && exitTime) {
        const start = getShiftStartTime(); // مثال "07:00"
        const [startH, startM] = start.split(':').map(Number);
        const [exitH, exitM] = exitTime.split(':').map(Number);
        
        let startTotalMins = startH * 60 + startM;
        let exitTotalMins = exitH * 60 + exitM;
        
        // معالجة الشفتات التي تمتد لمنتصف الليل
        if (exitTotalMins < startTotalMins) {
            exitTotalMins += 24 * 60;
        }
        
        const diffMins = exitTotalMins - startTotalMins;
        if (diffMins <= 0) {
            alert('وقت الخروج المدخل يسبق بداية الشفت!');
            return;
        }
        hoursInput = parseFloat((diffMins / 60).toFixed(2));
    }

    if (!hoursInput || hoursInput <= 0) {
        alert('الرجاء إدخال عدد ساعات صحيح أو تحديد وقت خروج دقيق');
        return;
    }
    if (hoursInput > remainingHours) {
        alert('عذراً، ساعات التصريح تتجاوز رصيدك المتبقي لهذا الشهر!');
        return;
    }

    remainingHours -= hoursInput;
    
    // الحصول على التاريخ مع اسم اليوم (الأحد، الاثنين...)
    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'numeric', day: 'numeric' };
    const dateStr = now.toLocaleDateString('ar-SA', options) + ' - ' + now.toLocaleTimeString('ar-SA', {hour: '2-digit', minute:'2-digit'});

    permitsList.push({ date: dateStr, hours: hoursInput });
    
    // تفريغ الحقول
    document.getElementById('permitHoursInput').value = '';
    document.getElementById('exitTimeInput').value = '';
    
    updateUI();
}

function editPermit(index) {
    const oldHours = permitsList[index].hours;
    const newHoursInput = prompt('عدل عدد ساعات التصريح:', oldHours);
    if (newHoursInput === null) return;
    
    const newHours = parseFloat(newHoursInput);
    if (!newHours || newHours <= 0) {
        alert('قيمة غير صالحة');
        return;
    }

    const diff = newHours - oldHours;
    if (diff > remainingHours) {
        alert('الرصيد المتبقي لا يكفي لهذه التعديلات!');
        return;
    }

    remainingHours -= diff;
    permitsList[index].hours = newHours;
    updateUI();
}

updateUI();
</script>

</body>
</html>
