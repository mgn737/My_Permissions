<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة الإجازات</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD10nYcvOM_5s8Hd-MFe2lTsRqkJ7TQ4vA",
            authDomain: "my--permissions.firebaseapp.com",
            projectId: "my--permissions",
            storageBucket: "my--permissions.firebasestorage.app",
            messagingSenderId: "476127156640",
            appId: "1:476127156640:web:48f68b18dba796f1a2acc5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.doc = doc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;
        window.updateDoc = updateDoc;

        window.isFirebaseReady = true;
        if (typeof window.startApp === 'function') {
            window.startApp();
        }
    </script>

    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --border-color: #eee;
            --input-bg: #f0f2f5;
            --input-border: #ccc;
            --title-color: #2c3e50;
            --table-th-bg: #f4f7f6;
            --table-border: #ddd;
        }

        .dark-mode {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --card-bg: #1e293b;
            --border-color: #334155;
            --input-bg: #0f172a;
            --input-border: #475569;
            --title-color: #f8fafc;
            --table-th-bg: #0f172a;
            --table-border: #334155;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            transition: background-color 0.3s;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        h2 { color: var(--title-color); font-size: 18px; margin: 0; transition: color 0.3s; }
        
        .header-btns-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .back-btn, .logout-btn {
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            display: inline-block;
        }
        .back-btn { background-color: #2980b9; }
        .logout-btn { background-color: #e74c3c; }
        
        .theme-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.3s;
        }
        .theme-icon-btn:hover {
            background-color: rgba(0,0,0,0.1);
        }
        .dark-mode .theme-icon-btn:hover {
            background-color: rgba(255,255,255,0.1);
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; text-align: right; color: var(--text-color); transition: color 0.3s; }
        select, input, textarea {
            width: 100%;
            padding: 9px;
            font-size: 14px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            box-sizing: border-box;
            background-color: var(--input-bg);
            color: var(--text-color);
            text-align: right;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        textarea { resize: vertical; min-height: 60px; }
        
        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: #9b59b6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.3s;
        }
        .action-btn:hover { background-color: #8e44ad; }

        h3 { color: var(--title-color); transition: color 0.3s; margin-top: 25px; font-size: 15px; }

        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
            font-size: 12px;
        }
        th, td {
            border: 1px solid var(--table-border);
            padding: 8px;
            text-align: center;
            transition: border-color 0.3s;
        }
        th { background-color: var(--table-th-bg); color: var(--title-color); transition: background-color 0.3s, color 0.3s; }
        .delete-btn { background-color: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<script>
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
</script>

<div class="container">
    <div class="header-flex">
        <div class="header-btns-group">
            <a href="home.html" class="back-btn">الرئيسية</a>
            <button id="themeToggleBtn" class="theme-icon-btn" onclick="toggleTheme()" title="تغيير المظهر">🌙</button>
        </div>
        <h2>إدارة الإجازات</h2>
        <button class="logout-btn" onclick="logout()">خروج</button>
    </div>

    <div class="form-group">
        <label>نوع الإجازة:</label>
        <select id="vacationType">
            <option value="اعتيادية">إجازة اعتيادية</option>
            <option value="مرضية">إجازة مرضية</option>
            <option value="اضطرارية">إجازة اضطرارية</option>
            <option value="أخرى">أخرى</option>
        </select>
    </div>

    <div style="display: flex; gap: 10px; width: 100%; margin-bottom: 15px;">
        <div style="flex:1;">
            <label>تاريخ البداية:</label>
            <input type="date" id="startDate">
        </div>
        <div style="flex:1;">
            <label>تاريخ النهاية:</label>
            <input type="date" id="endDate">
        </div>
    </div>

    <div class="form-group">
        <label>عدد الأيام:</label>
        <input type="number" id="vacationDays" placeholder="أدخل عدد الأيام" min="1">
    </div>
    
    <div class="form-group">
        <label>ملاحظات (اختياري):</label>
        <textarea id="vacationNotes" placeholder="أضف أي ملاحظات هنا..."></textarea>
    </div>

    <button class="action-btn" onclick="addVacation()">تسجيل الإجازة</button>

    <h3>سجل الإجازات</h3>
    <table>
        <thead>
            <tr>
                <th>النوع</th>
                <th>التاريخ</th>
                <th>الأيام</th>
                <th>إجراء</th>
            </tr>
        </thead>
        <tbody id="vacationsTableBody">
        </tbody>
    </table>
</div>

<script>
function initThemeBtn() {
    const isDark = document.body.classList.contains('dark-mode');
    const btn = document.getElementById('themeToggleBtn');
    if (btn) {
        btn.innerHTML = isDark ? '☀️' : '🌙';
    }
}

window.toggleTheme = function() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    initThemeBtn();
}

initThemeBtn();

if (localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = 'login.html';
}

let currentUsername = localStorage.getItem('currentUser') || 'defaultUser';
let vacationsList = [];

function logout() {
    localStorage.removeItem('isLoggedIn');
    localStorage.removeItem('currentUser');
    window.location.href = 'login.html';
}

document.getElementById('startDate').addEventListener('change', calculateDays);
document.getElementById('endDate').addEventListener('change', calculateDays);

function calculateDays() {
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    if (start && end) {
        const date1 = new Date(start);
        const date2 = new Date(end);
        const diffTime = Math.abs(date2 - date1);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
        if (diffDays > 0) {
            document.getElementById('vacationDays').value = diffDays;
        } else {
            document.getElementById('vacationDays').value = '';
        }
    }
}

async function loadVacations() {
    if (!window.db || !window.doc) {
        setTimeout(loadVacations, 200);
        return;
    }

    try {
        const docRef = window.doc(window.db, "vacationsData", currentUsername);
        const docSnap = await window.getDoc(docRef);

        if (docSnap.exists()) {
            vacationsList = docSnap.data().vacationsList || [];
        } else {
            vacationsList = [];
        }
        updateUI();
    } catch (e) {
        console.error("خطأ في جلب بيانات الإجازات:", e);
    }
}

async function saveVacationsToCloud() {
    try {
        if (!window.db || !window.doc) return;
        const docRef = window.doc(window.db, "vacationsData", currentUsername);
        await window.setDoc(docRef, { vacationsList: vacationsList }, { merge: true });
    } catch (e) {
        console.error("خطأ في حفظ الإجازة:", e);
    }
}

function updateUI() {
    const tbody = document.getElementById('vacationsTableBody');
    tbody.innerHTML = '';
    
    if (vacationsList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">لا توجد إجازات مسجلة</td></tr>';
        return;
    }

    vacationsList.forEach((v, index) => {
        let datesText = v.startDate;
        if(v.endDate && v.startDate !== v.endDate) {
            datesText += ` إلى ${v.endDate}`;
        }
        
        tbody.innerHTML += `
            <tr>
                <td>${v.type}</td>
                <td style="font-size: 11px;">${datesText}</td>
                <td>${v.days}</td>
                <td>
                    <button class="delete-btn" onclick="deleteVacation(${index})">🗑️</button>
                </td>
            </tr>
        `;
    });
}

window.addVacation = async function() {
    const type = document.getElementById('vacationType').value;
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const days = document.getElementById('vacationDays').value;
    const notes = document.getElementById('vacationNotes').value;

    if (!startDate || !days) {
        alert('الرجاء إدخال تاريخ البداية وعدد الأيام على الأقل!');
        return;
    }

    vacationsList.push({ 
        type, 
        startDate, 
        endDate: endDate || startDate, 
        days, 
        notes 
    });

    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';
    document.getElementById('vacationDays').value = '';
    document.getElementById('vacationNotes').value = '';

    updateUI();
    await saveVacationsToCloud();
    alert('تم تسجيل الإجازة بنجاح!');
}

window.deleteVacation = async function(index) {
    if (confirm('هل أنت متأكد من حذف هذه الإجازة؟')) {
        vacationsList.splice(index, 1);
        updateUI();
        await saveVacationsToCloud();
    }
}

window.startApp = function() {
    loadVacations();
};

if (window.isFirebaseReady) {
    window.startApp();
}
</script>

</body>
</html>
