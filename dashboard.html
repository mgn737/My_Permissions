<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة التصاريح</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h2 { color: #2c3e50; margin: 0; }
        .logout-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .logout-btn:hover { background-color: #c0392b; }
        
        .card {
            background: #f9f9f9;
            border: 1px solid #e1e1e1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #fff;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row .form-group {
            flex: 1;
        }
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover { background-color: #219653; }
        .btn-blue {
            background-color: #2980b9;
            margin-top: 10px;
        }
        .btn-blue:hover { background-color: #2471a3; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        th { background-color: #f2f2f2; }
        .edit-btn { background: #f39c12; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .delete-btn { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h2>لوحة التحكم - إدارة التصاريح</h2>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

    <!-- بطاقة الرصيد -->
    <div class="card" style="text-align: center; background: #e8f8f5; border-color: #a3e4d7;">
        <h3 style="margin: 0 0 5px 0; color: #16a085;">الرصيد المتبقي للشهر الحالي:</h3>
        <p id="remainingHoursDisplay" style="font-size: 24px; font-weight: bold; color: #138d75; margin: 0;">--</p>
    </div>

    <!-- قسم إضافة تصريح -->
    <div class="card">
        <h3>إضافة تصريح جديد</h3>
        
        <div class="form-group">
            <label>تاريخ التصريح:</label>
            <input type="date" id="permitDateInput">
        </div>

        <div class="form-group">
            <label>اختر الشفت:</label>
            <select id="shiftSelect" onchange="toggleCustomShift()">
                <option value="07:00-15:00">صباحي (07:00 ص - 03:00 م)</option>
                <option value="custom">شفت مخصص...</option>
            </select>
        </div>

        <div class="row" id="customShiftBox" style="display: none;">
            <div class="form-group">
                <label>بداية الشفت:</label>
                <input type="time" id="customStart" value="07:00">
            </div>
            <div class="form-group">
                <label>نهاية الشفت:</label>
                <input type="time" id="customEnd" value="15:00">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>ساعات التصريح:</label>
                <select id="permitHoursSelect">
                    <option value="0">0 ساعة</option>
                    <option value="1">1 ساعة</option>
                    <option value="2">2 ساعات</option>
                    <option value="3">3 ساعات</option>
                    <option value="4">4 ساعات</option>
                    <option value="5">5 ساعات</option>
                    <option value="6">6 ساعات</option>
                    <option value="7">7 ساعات</option>
                    <option value="8">8 ساعات</option>
                </select>
            </div>
            <div class="form-group">
                <label>دقائق التصريح:</label>
                <select id="permitMinsSelect">
                    <option value="0">0 دقيقة</option>
                    <option value="15">15 دقيقة</option>
                    <option value="30">30 دقيقة</option>
                    <option value="45">45 دقيقة</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>أو حدد وقت الخروج مباشرة (اختياري بدلاً من الساعات):</label>
            <input type="time" id="exitTimeInput">
        </div>

        <button class="btn" onclick="addPermit()">حفظ وإضافة التصريح</button>
        <button class="btn btn-blue" id="dynamicCalcBtn" style="display: none;" onclick="toggleCalcBox()">⚡ حاسبة وقت الخروج الذكية</button>
    </div>

    <!-- قسم الحاسبة الذكية -->
    <div class="card" id="calcSection" style="display: none; background: #fef9e7; border-color: #f9e79f;">
        <h3 id="calcBoxTitle" style="color: #d4ac0d;">⚡ حاسبة وقت الخروج:</h3>
        
        <div class="form-group">
            <label>تاريخ الخروج المستهدف:</label>
            <input type="date" id="calcDateInput">
        </div>

        <div class="form-group">
            <label>اختر الشفت:</label>
            <select id="calcShiftSelect" onchange="toggleCalcCustomShift()">
                <option value="07:00-15:00">صباحي (07:00 ص - 03:00 م)</option>
                <option value="custom">شفت مخصص...</option>
            </select>
        </div>

        <div class="row" id="calcCustomShiftBox" style="display: none;">
            <div class="form-group">
                <label>بداية الشفت:</label>
                <input type="time" id="calcCustomStart" value="07:00">
            </div>
            <div class="form-group">
                <label>نهاية الشفت:</label>
                <input type="time" id="calcCustomEnd" value="15:00">
            </div>
        </div>

        <button class="btn" style="background-color: #d4ac0d;" onclick="calculateInfo()">احسب وقت الخروج المطلوبة</button>

        <div id="calcResultBox" style="margin-top: 15px; display: none; background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #f39c12;">
            <p id="resText1" style="margin: 5px 0; font-size: 14px;"></p>
            <p id="resText2" style="margin: 5px 0; font-size: 14px; display: none;"></p>
        </div>
    </div>

    <!-- جدول السجلات -->
    <div class="card">
        <h3>سجل التصاريح المسجلة</h3>
        <table>
            <thead>
                <tr>
                    <th>التاريخ ووقت الخروج</th>
                    <th>المدة</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="permitsTableBody">
                <!-- تضاف البيانات هنا برمجياً -->
            </tbody>
        </table>
    </div>
</div>

<script>
if (localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = 'login.html';
}

const currentUser = localStorage.getItem('currentUser') || 'default_user';

document.getElementById('permitDateInput').valueAsDate = new Date();
document.getElementById('calcDateInput').valueAsDate = new Date();

function logout() {
    localStorage.removeItem('isLoggedIn');
    localStorage.removeItem('currentUser');
    window.location.href = 'login.html';
}

function toggleCustomShift() {
    const val = document.getElementById('shiftSelect').value;
    document.getElementById('customShiftBox').style.display = (val === 'custom') ? 'flex' : 'none';
}

function toggleCalcCustomShift() {
    const val = document.getElementById('calcShiftSelect').value;
    document.getElementById('calcCustomShiftBox').style.display = (val === 'custom') ? 'flex' : 'none';
}

function toggleCalcBox() {
    const box = document.getElementById('calcSection');
    box.style.display = (box.style.display === 'block') ? 'none' : 'block';
}

function checkMonthlyReset() {
    const now = new Date();
    const currentMonth = now.getMonth();
    const storedMonth = localStorage.getItem(currentUser + '_savedMonth');

    if (storedMonth === null || parseInt(storedMonth) !== currentMonth) {
        localStorage.setItem(currentUser + '_savedMonth', currentMonth);
        localStorage.setItem(currentUser + '_remainingTotalMins', '1320');
        localStorage.setItem(currentUser + '_permitsList', JSON.stringify([]));
    }
}

checkMonthlyReset();

let remainingTotalMins = parseInt(localStorage.getItem(currentUser + '_remainingTotalMins'));
if (isNaN(remainingTotalMins) || remainingTotalMins > 1320) {
    remainingTotalMins = 1320;
}

let permitsList = JSON.parse(localStorage.getItem(currentUser + '_permitsList')) || [];

function formatMinutesToReadable(totalMins) {
    if (isNaN(totalMins) || totalMins <= 0) return "0 ساعة";
    const h = Math.floor(totalMins / 60);
    const m = totalMins % 60;
    
    if (h > 0 && m > 0) return `${h} ساعة و ${m} دقيقة`;
    if (h > 0) return `${h} ساعة`;
    return `${m} دقيقة`;
}

function getShiftTimes() {
    const shiftVal = document.getElementById('shiftSelect').value;
    let start = "07:00";
    let end = "15:00";
    if(shiftVal !== 'custom') {
        const parts = shiftVal.split('-');
        start = parts[0];
        end = parts[1];
    } else {
        start = document.getElementById('customStart').value || "07:00";
        end = document.getElementById('customEnd').value || "15:00";
    }
    return { start, end };
}

function getCalcShiftTimes() {
    const shiftVal = document.getElementById('calcShiftSelect').value;
    let start = "07:00";
    let end = "15:00";
    if(shiftVal !== 'custom') {
        const parts = shiftVal.split('-');
        start = parts[0];
        end = parts[1];
    } else {
        start = document.getElementById('calcCustomStart').value || "07:00";
        end = document.getElementById('calcCustomEnd').value || "15:00";
    }
    return { start, end };
}

function formatTime12h(timeStr) {
    if (!timeStr) return '';
    let [h, m] = timeStr.split(':').map(Number);
    let period = 'ص';
    if (h >= 12) {
        period = 'م';
        if (h > 12) h -= 12;
    }
    if (h === 0) h = 12;
    return `${h}:${String(m).padStart(2, '0')} ${period}`;
}

function updateUI() {
    if (isNaN(remainingTotalMins) || remainingTotalMins > 1320) remainingTotalMins = 1320;
    
    document.getElementById('remainingHoursDisplay').innerText = formatMinutesToReadable(remainingTotalMins);
    localStorage.setItem(currentUser + '_remainingTotalMins', remainingTotalMins);
    localStorage.setItem(currentUser + '_permitsList', JSON.stringify(permitsList));

    const dynamicBtn = document.getElementById('dynamicCalcBtn');
    const calcSection = document.getElementById('calcSection');
    const calcBoxTitle = document.getElementById('calcBoxTitle');
    
    if (remainingTotalMins < 960 && remainingTotalMins >= 480) {
        dynamicBtn.style.display = 'block';
        dynamicBtn.innerText = '⚡ حاسبة وقت الخروج (توزيع على يومين)';
        calcBoxTitle.innerText = '⚡ حاسبة وقت الخروج (توزيع على يومين):';
    } else if (remainingTotalMins < 480 && remainingTotalMins > 0) {
        dynamicBtn.style.display = 'block';
        dynamicBtn.innerText = '⚡ حاسبة وقت الخروج (ليوم واحد)';
        calcBoxTitle.innerText = '⚡ حاسبة وقت الخروج (ليوم واحد):';
    } else {
        dynamicBtn.style.display = 'none';
        calcSection.style.display = 'none';
    }

    const tbody = document.getElementById('permitsTableBody');
    tbody.innerHTML = '';
    permitsList.forEach((p, index) => {
        tbody.innerHTML += `
            <tr>
                <td>${p.date}</td>
                <td>${formatMinutesToReadable(p.totalMins)}</td>
                <td>
                    <button class="edit-btn" onclick="editPermit(${index})">✏️</button>
                    <button class="delete-btn" onclick="deletePermit(${index})">🗑️</button>
                </td>
            </tr>
        `;
    });
}

function addPermit() {
    const selHours = parseInt(document.getElementById('permitHoursSelect').value) || 0;
    const selMins = parseInt(document.getElementById('permitMinsSelect').value) || 0;
    const exitTime = document.getElementById('exitTimeInput').value;
    const selectedDate = document.getElementById('permitDateInput').value;
    
    let permitMins = 0;
    let recordedExitTimeStr = '';

    if (selHours === 0 && selMins === 0 && exitTime) {
        const times = getShiftTimes();
        const [startH, startM] = times.start.split(':').map(Number);
        const [exitH, exitM] = exitTime.split(':').map(Number);
        
        let startTotalMins = startH * 60 + startM;
        let exitTotalMins = exitH * 60 + exitM;
        
        if (exitTotalMins < startTotalMins) {
            exitTotalMins += 24 * 60;
        }
        
        permitMins = exitTotalMins - startTotalMins;
        if (permitMins <= 0) {
            alert('وقت الخروج المدخل يسبق بداية الشفت!');
            return;
        }
        recordedExitTimeStr = formatTime12h(exitTime);
    } else {
        permitMins = (selHours * 60) + selMins;
        const times = getShiftTimes();
        const [startH, startM] = times.start.split(':').map(Number);
        let calculatedExitMins = (startH * 60 + startM + permitMins) % (24 * 60);
        let exH = Math.floor(calculatedExitMins / 60);
        let exM = calculatedExitMins % 60;
        recordedExitTimeStr = formatTime12h(`${String(exH).padStart(2,'0')}:${String(exM).padStart(2,'0')}`);
    }

    if (permitMins <= 0) {
        alert('الرجاء اختيار عدد الساعات والدقائق أو تحديد وقت خروج دقيق');
        return;
    }

    if (permitMins > remainingTotalMins) {
        alert(`❌ ساعات التصريح لاتكفي!\nرصيدك المتبقي فقط ${formatMinutesToReadable(remainingTotalMins)}.`);
        return;
    }

    remainingTotalMins -= permitMins;
    
    let dateStr = selectedDate;
    if (selectedDate) {
        const dObj = new Date(selectedDate);
        dateStr = dObj.toLocaleDateString('ar-SA', { year: 'numeric', month: 'numeric', day: 'numeric' });
    }
    const finalRecordStr = dateStr + ' - ' + recordedExitTimeStr;

    permitsList.push({ date: finalRecordStr, totalMins: permitMins });
    
    document.getElementById('permitHoursSelect').value = '0';
    document.getElementById('permitMinsSelect').value = '0';
    document.getElementById('exitTimeInput').value = '';
    
    updateUI();
}

function calculateInfo() {
    const times = getCalcShiftTimes();
    const [startH, startM] = times.start.split(':').map(Number);
    const [endH, endM] = times.end.split(':').map(Number);
    
    let startTotalMins = startH * 60 + startM;
    let endTotalMins = endH * 60 + endM;
    if (endTotalMins < startTotalMins) endTotalMins += 24 * 60;
    
    const shiftTotalMins = endTotalMins - startTotalMins;

    const selectedDate = document.getElementById('calcDateInput').value;
    let dObj = selectedDate ? new Date(selectedDate) : new Date();
    let dateStr1 = dObj.toLocaleDateString('ar-SA', { year: 'numeric', month: 'numeric', day: 'numeric' });

    const resultBox = document.getElementById('calcResultBox');
    const p1 = document.getElementById('resText1');
    const p2 = document.getElementById('resText2');

    if (remainingTotalMins >= 480 && remainingTotalMins < 960) {
        const remainderAfterDay2 = remainingTotalMins - 480;
        const workMinsDay1 = shiftTotalMins - remainderAfterDay2;

        if (workMinsDay1 <= 0) {
            alert('القيم الناتجة غير صالحة.');
            return;
        }

        let exit1TotalMins = (startTotalMins + workMinsDay1) % (24 * 60);
        let ex1H = Math.floor(exit1TotalMins / 60);
        let ex1M = exit1TotalMins % 60;
        let exit1Str = formatTime12h(`${String(ex1H).padStart(2,'0')}:${String(ex1M).padStart(2,'0')}`);

        let dObj2 = new Date(dObj);
        dObj2.setDate(dObj2.getDate() + 1);
        let dateStr2 = dObj2.toLocaleDateString('ar-SA', { year: 'numeric', month: 'numeric', day: 'numeric' });

        p1.innerHTML = `📌 <b>اليوم الأول (${dateStr1}):</b> تدوام ${formatMinutesToReadable(workMinsDay1)} ← وقت الخروج: <b>${exit1Str}</b>.`;
        p2.innerHTML = `📌 <b>اليوم الثاني (${dateStr2}):</b> <b>بصم واطلع</b> (يخصم 8 ساعات كاملة).`;
        p2.style.display = 'block';
    } 
    else if (remainingTotalMins < 480 && remainingTotalMins > 0) {
        const workMinsDay1 = shiftTotalMins - remainingTotalMins;

        if (workMinsDay1 < 0) {
            alert('الرصيد المتبقي أكبر من ساعات الشفت.');
            return;
        }

        let exit1TotalMins = (startTotalMins + workMinsDay1) % (24 * 60);
        let ex1H = Math.floor(exit1TotalMins / 60);
        let ex1M = exit1TotalMins % 60;
        let exit1Str = formatTime12h(`${String(ex1H).padStart(2,'0')}:${String(ex1M).padStart(2,'0')}`);

        p1.innerHTML = `📌 <b>اليوم الأول (${dateStr1}):</b> تدوام ${formatMinutesToReadable(workMinsDay1)} ← وقت الخروج: <b>${exit1Str}</b> (تستهلك رصيدك المتبقي ${formatMinutesToReadable(remainingTotalMins)}).`;
        p2.style.display = 'none';
    }

    resultBox.style.display = 'block';
}

function editPermit(index) {
    const oldMins = permitsList[index].totalMins;
    const oldH = Math.floor(oldMins / 60);
    const oldM = oldMins % 60;
    
    const newHoursInput = prompt('عدل عدد ساعات التصريح (بالساعات):', oldH);
    if (newHoursInput === null) return;
    const newMinsInput = prompt('عدل عدد دقائق التصريح (بالدقائق):', oldM);
    if (newMinsInput === null) return;
    
    const newH = parseInt(newHoursInput) || 0;
    const newM = parseInt(newMinsInput) || 0;
    const newTotalMins = (newH * 60) + newM;

    if (newTotalMins <= 0) {
        alert('قيمة غير صالحة');
        return;
    }

    const diffMins = newTotalMins - oldMins;

    if (diffMins > remainingTotalMins) {
        alert('الرصيد المتبقي لا يكفي لهذه التعديلات!');
        return;
    }

    remainingTotalMins -= diffMins;
    permitsList[index].totalMins = newTotalMins;
    updateUI();
}

function deletePermit(index) {
    if (confirm('هل أنت متأكد من حذف هذا التصريح؟ سيتم إعادة الساعات إلى رصيدك.')) {
        remainingTotalMins += permitsList[index].totalMins;
        if (remainingTotalMins > 1320) {
            remainingTotalMins = 1320;
        }
        permitsList.splice(index, 1);
        updateUI();
    }
}

updateUI();
</script>

</body>
</html>
