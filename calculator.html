<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة وقت الخروج (التصاريح)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        .logo {
            display: block;
            margin: 0 auto 15px auto;
            max-width: 120px;
            height: auto;
            border-radius: 8px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
            font-size: 13px;
            text-align: right;
        }
        /* تصغير الخانات وجعلها متناسقة على اليمين */
        input[type="time"], select {
            width: 50%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: #f0f2f5;
            text-align: right;
            display: block;
            margin-right: 0;
            margin-left: auto; /* يخلي الخانة تنجرف لليمين */
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: #f0f2f5;
            text-align: right;
        }
        .permit-group {
            display: flex;
            gap: 10px;
        }
        .permit-group .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1f618d;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f6f3;
            border-right: 5px solid #1abc9c;
            border-radius: 4px;
            display: none;
            text-align: right;
        }
        .result-box p {
            margin: 8px 0;
            font-size: 14px;
            line-height: 1.6;
        }
        .highlight {
            font-weight: bold;
            color: #d35400;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="IMG_3974.jpeg" class="logo" alt="شعار">
    <h2>حاسبة وقت الخروج (التصاريح)</h2>
    
    <div class="form-group">
        <label for="calcType">طريقة الحساب:</label>
        <select id="calcType">
            <option value="1">يوم واحد</option>
            <option value="2">يومين</option>
        </select>
    </div>

    <div class="form-group">
        <label for="startTime">بداية الشفت (متى تداوم):</label>
        <input type="time" id="startTime" required>
    </div>

    <div class="form-group">
        <label for="endTime">نهاية الشفت المعتاد:</label>
        <input type="time" id="endTime" required>
    </div>

    <div class="form-group">
        <label>رصيد التصريح المراد استخدامه:</label>
        <div class="permit-group">
            <div class="form-group">
                <input type="number" id="permitHours" placeholder="ساعات (مثال: 2)" min="0" max="24">
            </div>
            <div class="form-group">
                <input type="number" id="permitMinutes" placeholder="دقائق (مثال: 30)" min="0" max="59">
            </div>
        </div>
    </div>

    <button onclick="calculateExitTime()">احسب وقت الخروج</button>

    <div class="result-box" id="resultBox">
        <p id="resultText"></p>
    </div>
</div>

<script>
function format12Hour(totalMins) {
    let hours24 = Math.floor((totalMins / 60) % 24);
    let mins = totalMins % 60;
    let period = hours24 >= 12 ? 'م' : 'ص';
    let hours12 = hours24 % 12;
    hours12 = hours12 ? hours12 : 12; // الساعة 12 بدلاً من 0
    return `${hours12}:${String(mins).padStart(2, '0')} ${period}`;
}

function calculateExitTime() {
    const type = document.getElementById('calcType').value;
    const startTimeVal = document.getElementById('startTime').value;
    const endTimeVal = document.getElementById('endTime').value;
    const pHours = parseInt(document.getElementById('permitHours').value) || 0;
    const pMinutes = parseInt(document.getElementById('permitMinutes').value) || 0;
    
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');

    if (!startTimeVal || !endTimeVal) {
        alert('الرجاء إدخال وقت بداية ونهاية الشفت');
        return;
    }

    const [startH, startM] = startTimeVal.split(':').map(Number);
    const [endH, endM] = endTimeVal.split(':').map(Number);
    
    let startTotalMins = startH * 60 + startM;
    let endTotalMins = endH * 60 + endM;
    const permitTotalMins = pHours * 60 + pMinutes;

    if (type === '1') {
        // نظام يوم واحد
        if (endTotalMins <= startTotalMins) {
            endTotalMins += 24 * 60;
        }

        const totalShiftMins = endTotalMins - startTotalMins;
        const actualWorkMins = totalShiftMins - permitTotalMins;
        const exitTotalMins = startTotalMins + actualWorkMins;

        const formattedExit = format12Hour(exitTotalMins);
        const actH = Math.floor(actualWorkMins / 60);
        const actM = actualWorkMins % 60;

        resultText.innerHTML = `
            وقت الخروج بعد خصم التصريح: <span class="highlight">${formattedExit}</span><br>
            ساعات العمل الفعلية للدوام: <span class="highlight">${actH} ساعة و ${actM} دقيقة</span>
        `;
    } else {
        // نظام يومين (تغطية اليوم الثاني بالكامل بالتصريح وباقي الساعات لليوم الأول)
        if (endTotalMins <= startTotalMins) {
            endTotalMins += 24 * 60;
        }

        const singleShiftMins = endTotalMins - startTotalMins; // مدة الشفت الواحد (مثلاً 8 ساعات)
        const day2CoverMins = singleShiftMins; // اليوم الثاني كامل مغطى (نفس مدة الشفت)

        if (permitTotalMins <= day2CoverMins) {
            // إذا كان التصريح أقل من أو يساوي شفت اليوم الثاني
            // اليوم الثاني بالكامل بصم واطلع، واليوم الأول دوام كامل
            resultText.innerHTML = `
                اليوم الأول: <span class="highlight">دوام كامل (لا يوجد خروج مبكر)</span><br>
                ساعات العمل في اليوم الأول: <span class="highlight">${Math.floor(singleShiftMins / 60)} ساعات</span><br>
                اليوم الثاني: <span class="highlight">بصم واطلع</span><br>
                ساعات العمل في اليوم الثاني: <span class="highlight">لا يوجد (مغطى بالتصريح)</span>
            `;
        } else {
            // إذا كان التصريح أكبر من شفت اليوم الثاني (يعني باقي رصيد يخصم من اليوم الأول)
            const remainingPermitMins = permitTotalMins - day2CoverMins;
            const day1WorkMins = singleShiftMins - remainingPermitMins;
            
            // وقت الخروج في اليوم الأول = بداية الشفت + ساعات العمل المتبقية في اليوم الأول
            const exitTotalMins = startTotalMins + day1WorkMins;
            const formattedExit = format12Hour(exitTotalMins);

            const d1H = Math.floor(day1WorkMins / 60);
            const d1M = day1WorkMins % 60;

            resultText.innerHTML = `
                وقت الخروج في اليوم الأول: <span class="highlight">${formattedExit}</span><br>
                ساعات العمل في اليوم الأول: <span class="highlight">${d1H} ساعة و ${d1M} دقيقة</span><br>
                اليوم الثاني: <span class="highlight">بصم واطلع</span><br>
                ساعات العمل في اليوم الثاني: <span class="highlight">لا يوجد (مغطى بالتصريح)</span>
            `;
        }
    }

    resultBox.style.display = 'block';
}
</script>

</body>
</html>
