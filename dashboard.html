    <!-- استدعاء مكتبات Firebase السحابية -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD10nYcvOM_5s8Hd-MFe2lTsRqkJ7TQ4vA",
            authDomain: "my--permissions.firebaseapp.com",
            projectId: "my--permissions",
            storageBucket: "my--permissions.firebasestorage.app",
            messagingSenderId: "476127156640",
            appId: "1:476127156640:web:48f68b18dba796f1a2acc5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.doc = doc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;
        window.updateDoc = updateDoc;

        window.isFirebaseReady = true;
        if (typeof window.startApp === 'function') {
            window.startApp();
        }
    </script>

    <style>
        /* المتغيرات الأساسية (الوضع النهاري) */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --border-color: #eee;
            --input-bg: #f0f2f5;
            --input-border: #ccc;
            --title-color: #2c3e50;
            --stats-bg: #e8f6f3;
            --stats-border: #1abc9c;
            --stats-title: #16a085;
            --stats-num: #2c3e50;
            --stats-small: #7f8c8d;
            --calc-bg: #fef9e7;
            --calc-border: #f39c12;
            --calc-title: #d35400;
            --result-bg: #fff;
            --table-th-bg: #f4f7f6;
            --table-border: #ddd;
        }

        /* المتغيرات للوضع الليلي */
        .dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --input-bg: #2c2c2c;
            --input-border: #444;
            --title-color: #e0e0e0;
            --stats-bg: #0b2b26;
            --stats-border: #16a085;
            --stats-title: #48c9b0;
            --stats-num: #e0e0e0;
            --stats-small: #aaa;
            --calc-bg: #332200;
            --calc-border: #b9770e;
            --calc-title: #f39c12;
            --result-bg: #1e1e1e;

        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            transition: background-color 0.3s;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            transition: border-color 0.3s;

        h2 { color: var(--title-color); font-size: 18px; margin: 0; transition: color 0.3s; }
        
        .header-btns-group {

        .back-btn, .logout-btn, .theme-btn {

        .back-btn { background-color: #2980b9; }
        .logout-btn { background-color: #e74c3c; }
        .theme-btn { background-color: #f39c12; transition: 0.3s; font-weight: bold; }
        
        .card-stats {
            background-color: var(--stats-bg);

            border-radius: 8px;

            margin-bottom: 20px;

        }
        .card-stats h3 { margin: 0 0 5px 0; color: var(--stats-title); font-size: 15px; transition: color 0.3s; }
        .card-stats span { font-size: 20px; font-weight: bold; color: var(--stats-num); display: block; transition: color 0.3s; }
        .card-stats small { font-size: 13px; color: var(--stats-small); margin-top: 5px; display: block; transition: color 0.3s; }

        .dynamic-calc-btn {

        .result-box p { margin: 6px 0; font-size: 13px; color: var(--text-color); transition: color 0.3s; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; text-align: right; color: var(--text-color); transition: color 0.3s; }
        select, input {
            width: 100%;
            padding: 9px;
            font-size: 14px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            box-sizing: border-box;
            background-color: var(--input-bg);
            color: var(--text-color);
            text-align: right;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        .note-text {
            font-size: 11px;
            color: var(--stats-small);

            text-align: right;
            transition: color 0.3s;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .action-btn:hover { background-color: #219653; }
        .btn-calc { background-color: #e67e22; }

        h3 { color: var(--title-color); transition: color 0.3s; }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            font-size: 12px;
        }
        th, td {

            padding: 8px;

        th { background-color: var(--table-th-bg); color: var(--title-color); transition: background-color 0.3s, color 0.3s; }
        .edit-btn { background-color: #f39c12; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; margin-left: 4px; }
        .delete-btn { background-color: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<!-- سكريبت لمنع الشاشة البيضاء عند التحديث إذا كان الوضع الليلي مفعل -->
<script>

</script>

<div class="container">

            <p id="resText2"></p>

    <div class="form-group">

        <select id="shiftSelect" onchange="updateUI(); toggleCustomShift();">

            <option value="05:00-13:00">الفترة الثانية (5 ص - 1 م)</option>
            <option value="22:00-06:00">الفترة الثالثة (10 م - 6 ص)</option>
            <option value="00:00-08:00">الفترة الرابعة (12 ص - 8 ص)</option>

                            for(let i=1; i<60; i++) {

    <h3 style="margin-top: 25px; font-size: 15px;">سجل التصاريح لهذا الشهر</h3>
    <table>

            <tr>
                <th>اليوم والتاريخ</th>
                <th>الساعات</th>

<script>
// إعداد وتشغيل النمط الليلي/النهاري
function initThemeBtn() {
    const isDark = document.body.classList.contains('dark-mode');
    const btn = document.getElementById('themeToggleBtn');
    if (btn) {
        btn.innerHTML = isDark ? '☀️ نهاري' : '🌙 ليلي';
        btn.style.backgroundColor = isDark ? '#2c3e50' : '#f39c12';
    }
}

window.toggleTheme = function() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    initThemeBtn();
}

initThemeBtn();

if (localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = 'login.html';
}

let currentUsername = localStorage.getItem('currentUser') || 'defaultUser';

document.getElementById('permitDateInput').valueAsDate = new Date();
document.getElementById('calcDateInput').valueAsDate = new Date();

function logout() {
    localStorage.removeItem('isLoggedIn');
    localStorage.removeItem('currentUser');
    window.location.href = 'login.html';
}

function toggleCustomShift() {
    const val = document.getElementById('shiftSelect').value;
    document.getElementById('customShiftBox').style.display = (val === 'custom') ? 'flex' : 'none';
}

function toggleCalcCustomShift() {
    const val = document.getElementById('calcShiftSelect').value;
    document.getElementById('calcCustomShiftBox').style.display = (val === 'custom') ? 'flex' : 'none';
}

function toggleCalcBox() {
    const box = document.getElementById('calcSection');
    box.style.display = (box.style.display === 'block') ? 'none' : 'block';
}

let remainingTotalMins = 1320;
let remainingDelayMins = 480;
let permitsList = [];
let isDataLoaded = false;

async function loadDataFromCloud() {
    if (!window.db || !window.doc) {
        setTimeout(loadDataFromCloud, 200);
        return;
    }

    try {
        const docRef = window.doc(window.db, "permitsData", currentUsername);
        const docSnap = await window.getDoc(docRef);

        const now = new Date();
        const currentMonth = now.getMonth();

        if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.savedMonth === currentMonth) {
                remainingTotalMins = (data.remainingTotalMins !== undefined) ? Number(data.remainingTotalMins) : 1320;
                remainingDelayMins = (data.remainingDelayMins !== undefined) ? Number(data.remainingDelayMins) : 480;
                permitsList = data.permitsList || [];
            } else {
                remainingTotalMins = 1320;
                remainingDelayMins = 480;
                permitsList = [];
                await window.setDoc(docRef, { savedMonth: currentMonth, remainingTotalMins, remainingDelayMins, permitsList }, { merge: true });
            }
        } else {
            remainingTotalMins = 1320;
            remainingDelayMins = 480;
            permitsList = [];
            await window.setDoc(docRef, { savedMonth: currentMonth, remainingTotalMins, remainingDelayMins, permitsList }, { merge: true });
        }
        
        isDataLoaded = true;
        updateUI();
    } catch (e) {
        console.error("خطأ في جلب البيانات:", e);
        if (!isDataLoaded) {
            isDataLoaded = true;
            updateUI();
        }
    }
}

async function saveDataToCloud() {
    try {
        if (!window.db || !window.doc) return;
        const now = new Date();
        const currentMonth = now.getMonth();
        const docRef = window.doc(window.db, "permitsData", currentUsername);
        await window.setDoc(docRef, {
            savedMonth: currentMonth,
            remainingTotalMins: Number(remainingTotalMins),
            remainingDelayMins: Number(remainingDelayMins),
            permitsList: permitsList
        }, { merge: true });
    } catch (e) {
        console.error("خطأ في الحفظ:", e);
    }
}

function formatMinutesToReadable(totalMins) {
    if (isNaN(totalMins) || totalMins <= 0) return "0 ساعة";
    const h = Math.floor(totalMins / 60);
    const m = totalMins % 60;
    if (h > 0 && m > 0) return `${h} ساعة و ${m} دقيقة`;
    if (h > 0) return `${h} ساعة`;
    return `${m} دقيقة`;
}

function getShiftTimes() {
    const shiftVal = document.getElementById('shiftSelect').value;
    let start = "07:15", end = "15:15";
    if(shiftVal !== 'custom') {
        const parts = shiftVal.split('-');
        start = parts[0]; end = parts[1];
    } else {
        start = document.getElementById('customStart').value || "07:15";
        end = document.getElementById('customEnd').value || "15:15";
    }
    return { start, end };
}

function getCalcShiftTimes() {
    const shiftVal = document.getElementById('calcShiftSelect').value;
    let start = "07:15", end = "15:15";
    if(shiftVal !== 'custom') {
        const parts = shiftVal.split('-');
        start = parts[0]; end = parts[1];
    } else {
        start = document.getElementById('calcCustomStart').value || "07:15";
        end = document.getElementById('calcCustomEnd').value || "15:15";
    }
    return { start, end };
}

function formatTime12h(timeStr) {
    if (!timeStr) return '';
    let [h, m] = timeStr.split(':').map(Number);
    let period = 'ص';
    if (h >= 12) {
        period = 'م';
        if (h > 12) h -= 12;
    }
    if (h === 0) h = 12;
    return `${h}:${String(m).padStart(2, '0')} ${period}`;
}

function updateUI() {
    if (isNaN(remainingTotalMins) || remainingTotalMins > 1320) remainingTotalMins = 1320;
    if (remainingTotalMins < 0) remainingTotalMins = 0;
    if (isNaN(remainingDelayMins)) remainingDelayMins = 480;
    
    document.getElementById('remainingHoursDisplay').innerText = formatMinutesToReadable(remainingTotalMins);
    document.getElementById('remainingDelayDisplay').innerText = formatMinutesToReadable(remainingDelayMins);

    const dynamicBtn = document.getElementById('dynamicCalcBtn');
    const calcSection = document.getElementById('calcSection');
    const calcBoxTitle = document.getElementById('calcBoxTitle');
    
    if (remainingTotalMins < 960 && remainingTotalMins >= 480) {
        dynamicBtn.style.display = 'block';
        dynamicBtn.innerText = '⚡ حاسبة توزيع التصريح على (يومين)';
        calcBoxTitle.innerText = '⚡ حاسبة وقت الخروج (توزيع على يومين):';
    } else if (remainingTotalMins < 480 && remainingTotalMins > 0) {
        dynamicBtn.style.display = 'block';
        dynamicBtn.innerText = '⚡ حاسبة وقت الخروج (ليوم واحد)';
        calcBoxTitle.innerText = '⚡ حاسبة وقت الخروج (ليوم واحد):';
    } else {
        dynamicBtn.style.display = 'none';
        calcSection.style.display = 'none';
    }

    const tbody = document.getElementById('permitsTableBody');
    tbody.innerHTML = '';
    permitsList.forEach((p, index) => {
        tbody.innerHTML += `
            <tr>
                <td>${p.date}</td>
                <td>${formatMinutesToReadable(p.totalMins)}</td>
                <td>
                    <button class="edit-btn" onclick="editPermit(${index})">✏️</button>
                    <button class="delete-btn" onclick="deletePermit(${index})">🗑️</button>
                </td>
            </tr>
        `;
    });
}

window.addPermit = async function() {
    const selHours = parseInt(document.getElementById('permitHoursSelect').value) || 0;
    const selMins = parseInt(document.getElementById('permitMinsSelect').value) || 0;
    const exitTime = document.getElementById('exitTimeInput').value;
    const selectedDate = document.getElementById('permitDateInput').value;
    
    let permitMins = 0;
    let recordedExitTimeStr = '';

    if (selHours === 0 && selMins === 0 && exitTime) {
        const times = getShiftTimes();
        const [startH, startM] = times.start.split(':').map(Number);
        const [endH, endM] = times.end.split(':').map(Number);
        const [exitH, exitM] = exitTime.split(':').map(Number);
        
        let startTotalMins = startH * 60 + startM;
        let endTotalMins = endH * 60 + endM;
        let exitTotalMins = exitH * 60 + exitM;

        if (endTotalMins < startTotalMins) endTotalMins += 24 * 60;
        if (exitTotalMins < startTotalMins) exitTotalMins += 24 * 60;
        
        if (exitTotalMins > endTotalMins) {
            alert('وقت الخروج المدخل يتجاوز وقت نهاية الشفت!');
            return;
        }
        
        permitMins = endTotalMins - exitTotalMins;
        
        if (permitMins <= 0) {
            alert('وقت الخروج يساوي نهاية الشفت (لا يوجد استئذان)!');
            return;
        }
        
        recordedExitTimeStr = formatTime12h(exitTime);
    } else {
        permitMins = (selHours * 60) + selMins;
        const times = getShiftTimes();
        const [startH, startM] = times.start.split(':').map(Number);
        const [endH, endM] = times.end.split(':').map(Number);
        
        let startTotalMins = startH * 60 + startM;
        let endTotalMins = endH * 60 + endM;
        if (endTotalMins < startTotalMins) endTotalMins += 24 * 60;
        
        let exitTotalMins = endTotalMins - permitMins;
        if (exitTotalMins < 0) exitTotalMins += 24 * 60;
        
        let exH = Math.floor(exitTotalMins / 60) % 24;
        let exM = exitTotalMins % 60;
        recordedExitTimeStr = formatTime12h(`${String(exH).padStart(2,'0')}:${String(exM).padStart(2,'0')}`);
    }

    if (permitMins <= 0) {
        alert('الرجاء اختيار عدد الساعات والدقائق أو تحديد وقت خروج دقيق');
        return;
    }

    if (permitMins > remainingTotalMins) {
        alert(`❌ ساعات التصريح لاتكفي!\nرصيدك المتبقي فقط ${formatMinutesToReadable(remainingTotalMins)}.`);
        return;
    }

    remainingTotalMins -= permitMins;
    
    let dateStr = selectedDate;
    if (selectedDate) {
        const dObj = new Date(selectedDate);
        dateStr = dObj.toLocaleDateString('ar-SA', { year: 'numeric', month: 'numeric', day: 'numeric' });
    }
    const finalRecordStr = dateStr + ' - ' + recordedExitTimeStr;

    permitsList.push({ date: finalRecordStr, totalMins: permitMins });
    
    document.getElementById('permitHoursSelect').value = '0';
    document.getElementById('permitMinsSelect').value = '0';
    document.getElementById('exitTimeInput').value = '';
    
    updateUI();
    await saveDataToCloud();
}

window.calculateInfo = function() {
    const times = getCalcShiftTimes();
    const [startH, startM] = times.start.split(':').map(Number);
    const [endH, endM] = times.end.split(':').map(Number);
    
    let startTotalMins = startH * 60 + startM;
    let endTotalMins = endH * 60 + endM;
    if (endTotalMins < startTotalMins) endTotalMins += 24 * 60;
    
    const shiftTotalMins = endTotalMins - startTotalMins;

    const selectedDate = document.getElementById('calcDateInput').value;
    let dObj = selectedDate ? new Date(selectedDate) : new Date();
    let dateStr1 = dObj.toLocaleDateString('ar-SA', { year: 'numeric', month: 'numeric', day: 'numeric' });

    const resultBox = document.getElementById('calcResultBox');
    const p1 = document.getElementById('resText1');
    const p2 = document.getElementById('resText2');

    if (remainingTotalMins >= 480 && remainingTotalMins < 960) {
        const remainderAfterDay2 = remainingTotalMins - 480;
        const workMinsDay1 = shiftTotalMins - remainderAfterDay2;

        let exit1TotalMins = (startTotalMins + workMinsDay1) % (24 * 60);
        let ex1H = Math.floor(exit1TotalMins / 60);
        let ex1M = exit1TotalMins % 60;
        let exit1Str = formatTime12h(`${String(ex1H).padStart(2,'0')}:${String(ex1M).padStart(2,'0')}`);

        let dObj2 = new Date(dObj);
        dObj2.setDate(dObj2.getDate() + 1);
        let dateStr2 = dObj2.toLocaleDateString('ar-SA', { year: 'numeric', month: 'numeric', day: 'numeric' });

        p1.innerHTML = `📌 <b>اليوم الأول (${dateStr1}):</b> تداوم ${formatMinutesToReadable(workMinsDay1)} ← وقت الخروج: <b>${exit1Str}</b>.`;
        p2.innerHTML = `📌 <b>اليوم الثاني (${dateStr2}):</b> <b>بصم واطلع</b> (يخصم 8 ساعات كاملة).`;
        p2.style.display = 'block';
    } else if (remainingTotalMins < 480 && remainingTotalMins > 0) {
        const workMinsDay1 = shiftTotalMins - remainingTotalMins;

        let exit1TotalMins = (startTotalMins + workMinsDay1) % (24 * 60);
        let ex1H = Math.floor(exit1TotalMins / 60);
        let ex1M = exit1TotalMins % 60;
        let exit1Str = formatTime12h(`${String(ex1H).padStart(2,'0')}:${String(ex1M).padStart(2,'0')}`);

        p1.innerHTML = `📌 <b>اليوم الأول (${dateStr1}):</b> تداوم ${formatMinutesToReadable(workMinsDay1)} ← وقت الخروج: <b>${exit1Str}</b>.`;
        p2.style.display = 'none';
    }

    resultBox.style.display = 'block';
}

window.editPermit = async function(index) {
    const oldMins = permitsList[index].totalMins;
    const oldH = Math.floor(oldMins / 60);
    const oldM = oldMins % 60;
    
    const newHoursInput = prompt('عدل عدد ساعات التصريح:', oldH);
    if (newHoursInput === null) return;
    const newMinsInput = prompt('عدل عدد دقائق التصريح:', oldM);
    if (newMinsInput === null) return;
    
    const newH = parseInt(newHoursInput) || 0;
    const newM = parseInt(newMinsInput) || 0;
    const newTotalMins = (newH * 60) + newM;

    if (newTotalMins <= 0) return alert('قيمة غير صالحة');

    const diffMins = newTotalMins - oldMins;
    if (diffMins > remainingTotalMins) return alert('الرصيد المتبقي لا يكفي!');

    remainingTotalMins -= diffMins;
    permitsList[index].totalMins = newTotalMins;
    updateUI();
    await saveDataToCloud();
}

window.deletePermit = async function(index) {
    if (confirm('هل أنت متأكد من حذف هذا التصريح؟')) {
        remainingTotalMins = Number(remainingTotalMins) + Number(permitsList[index].totalMins);
        if (remainingTotalMins > 1320) remainingTotalMins = 1320;
        permitsList.splice(index, 1);
        updateUI();
        await saveDataToCloud();
    }
}

window.startApp = function() {
    loadDataFromCloud();
};

if (window.isFirebaseReady) {
    window.startApp();
}
</script>
