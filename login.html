<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - إدارة التصاريح</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 20px; font-size: 20px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #f0f2f5;
            text-align: right;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:hover { background-color: #219653; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>تسجيل الدخول لنظام التصاريح</h2>
    <div class="form-group">
        <label>اسم المستخدم:</label>
        <input type="text" id="usernameInput" placeholder="أدخل اسم المستخدم">
    </div>
    <div class="form-group">
        <label>كلمة المرور:</label>
        <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور">
    </div>
    <button class="login-btn" onclick="login()">دخول</button>
    <p id="errorMsg" class="error-msg">اسم المستخدم أو كلمة المرور غير صحيحة!</p>
</div>

<script>
function login() {
    const user = document.getElementById('usernameInput').value.trim();
    const pass = document.getElementById('passwordInput').value.trim();
    
    // قائمة المستخدمين المعتمدين مع كلمات مرورهم
    const usersDb = {
        "Fahad": "1606",
        "admin": "1234" // يمكنك تغيير حساب الأدمن أو اسمك القديم هنا
    };

    if (usersDb[user] && usersDb[user] === pass) {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('currentUser', user); // حفظ اسم المستخدم الحالي لفصل بياناته
        window.location.href = 'dashboard.html';
    } else {
        document.getElementById('errorMsg').style.display = 'block';
    }
}
</script>

</body>
</html>
