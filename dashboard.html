<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة التصاريح الشهرية</title>
    <!-- استدعاء مكتبات Firebase السحابية -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD10nYcvOM_5s8Hd-MFe2lTsRqkJ7TQ4vA",
            authDomain: "my--permissions.firebaseapp.com",
            projectId: "my--permissions",
            storageBucket: "my--permissions.firebasestorage.app",
            messagingSenderId: "476127156640",
            appId: "1:476127156640:web:48f68b18dba796f1a2acc5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.doc = doc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;
        window.updateDoc = updateDoc;

        window.isFirebaseReady = true;
        if (typeof window.startApp === 'function') {
            window.startApp();
        }
    </script>

    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --border-color: #eee;
            --input-bg: #f0f2f5;
            --input-border: #ccc;
            --title-color: #2c3e50;
            --stats-bg: #e8f8f5;
            --stats-border: #2ecc71;
            --stats-title: #27ae60;
            --stats-num: #2c3e50;
            --table-th-bg: #f4f7f6;
            --table-border: #ddd;
        }

        .dark-mode {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --card-bg: #1e293b;
            --border-color: #334155;
            --input-bg: #0f172a;
            --input-border: #475569;
            --title-color: #f8fafc;
            --stats-bg: #064e3b;
            --stats-border: #059669;
            --stats-title: #34d399;
            --stats-num: #f8fafc;
            --table-th-bg: #0f172a;
            --table-border: #334155;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            transition: background-color 0.3s;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        h2 { color: var(--title-color); font-size: 18px; margin: 0; transition: color 0.3s; }
        
        .header-btns-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .back-btn, .logout-btn {
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            display: inline-block;
        }
        .back-btn { background-color: #2980b9; }
        .logout-btn { background-color: #e74c3c; }
        
        .theme-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.3s;
        }
        .theme-icon-btn:hover {
            background-color: rgba(0,0,0,0.1);
        }
        .dark-mode .theme-icon-btn:hover {
            background-color: rgba(255,255,255,0.1);
        }

        .card-stats {
            background-color: var(--stats-bg);
            border: 1px solid var(--stats-border);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .card-stats h3 { margin: 0 0 5px 0; color: var(--stats-title); font-size: 16px; transition: color 0.3s; }
        .card-stats span { font-size: 20px; font-weight: bold; color: var(--stats-num); transition: color 0.3s; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; text-align: right; color: var(--text-color); transition: color 0.3s; }
        select, input {
            width: 100%;
            padding: 9px;
            font-size: 14px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            box-sizing: border-box;
            background-color: var(--input-bg);
            color: var(--text-color);
            text-align: right;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .action-btn:hover { background-color: #27ae60; }

        h3 { color: var(--title-color); transition: color 0.3s; }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            font-size: 12px;
        }
        th, td {
            border: 1px solid var(--table-border);
            padding: 8px;
            text-align: center;
            transition: border-color 0.3s;
        }
        th { background-color: var(--table-th-bg); color: var(--title-color); transition: background-color 0.3s, color 0.3s; }
        .edit-btn { background-color: #f39c12; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; margin-left: 4px; }
        .delete-btn { background-color: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<script>
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
</script>

<div class="container">
    <div class="header-flex">
        <div class="header-btns-group">
            <a href="home.html" class="back-btn">الرئيسية</a>
            <button id="themeToggleBtn" class="theme-icon-btn" onclick="toggleTheme()" title="تغيير المظهر">🌙</button>
        </div>
        <h2>إدارة التصاريح الشهرية</h2>
        <button class="logout-btn" onclick="logout()">خروج</button>
    </div>

    <div class="card-stats">
        <h3>رصيد التصاريح المتبقي: <span id="remainingPermitsDisplay">جاري التحميل...</span></h3>
    </div>

    <div class="form-group">
        <label>مدة الاستئذان (بالدقائق):</label>
        <input type="number" id="permitMinutes" placeholder="مثال: 60 أو 120" min="1">
    </div>

    <div class="form-group">
        <label>تاريخ التصريح:</label>
        <input type="date" id="permitDateInput">
    </div>

    <button class="action-btn" onclick="addPermit()">حفظ وخصم التصريح</button>

    <h3 style="margin-top: 25px; font-size: 15px;">سجل التصاريح لهذا الشهر</h3>
    <table>
        <thead>
            <tr>
                <th>التاريخ</th>
                <th>المدة</th>
                <th>الإجراءات</th>
            </tr>
        </thead>
        <tbody id="permitsTableBody">
        </tbody>
    </table>
</div>

<script>
function initThemeBtn() {
    const isDark = document.body.classList.contains('dark-mode');
    const btn = document.getElementById('themeToggleBtn');
    if (btn) {
        btn.innerHTML = isDark ? '☀️' : '🌙';
    }
}

window.toggleTheme = function() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    initThemeBtn();
}

initThemeBtn();

if (localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = 'login.html';
}

let currentUsername = localStorage.getItem('currentUser') || 'defaultUser';
document.getElementById('permitDateInput').valueAsDate = new Date();

function logout() {
    localStorage.removeItem('isLoggedIn');
    localStorage.removeItem('currentUser');
    window.location.href = 'login.html';
}

let remainingTotalMins = 1320;
let permitsList = [];
let isDataLoaded = false;

async function loadDataFromCloud() {
    if (!window.db || !window.doc) {
        setTimeout(loadDataFromCloud, 200);
        return;
    }

    try {
        const docRef = window.doc(window.db, "permitsData", currentUsername);
        const docSnap = await window.getDoc(docRef);

        const now = new Date();
        const currentMonth = now.getMonth();

        if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.savedMonth === currentMonth) {
                remainingTotalMins = (data.remainingTotalMins !== undefined) ? Number(data.remainingTotalMins) : 1320;
                permitsList = data.permitsList || [];
            } else {
                remainingTotalMins = 1320;
                permitsList = [];
                await window.setDoc(docRef, { 
                    savedMonth: currentMonth, 
                    remainingTotalMins, 
                    permitsList,
                    delaysList: data.delaysList || [],
                    remainingDelayMins: data.remainingDelayMins !== undefined ? data.remainingDelayMins : 480
                }, { merge: true });
            }
        } else {
            remainingTotalMins = 1320;
            permitsList = [];
            await window.setDoc(docRef, { savedMonth: currentMonth, remainingTotalMins, permitsList }, { merge: true });
        }
        
        isDataLoaded = true;
        updateUI();
    } catch (e) {
        console.error("خطأ في جلب بيانات التصاريح:", e);
        if (!isDataLoaded) {
            isDataLoaded = true;
            updateUI();
        }
    }
}

async function saveDataToCloud() {
    try {
        if (!window.db || !window.doc) return;
        const now = new Date();
        const currentMonth = now.getMonth();
        const docRef = window.doc(window.db, "permitsData", currentUsername);
        await window.setDoc(docRef, {
            savedMonth: currentMonth,
            remainingTotalMins: Number(remainingTotalMins),
            permitsList: permitsList
        }, { merge: true });
    } catch (e) {
        console.error("خطأ في حفظ التصريح:", e);
    }
}

function formatMinutesToReadable(totalMins) {
    if (isNaN(totalMins) || totalMins <= 0) return "0 ساعة";
    const h = Math.floor(totalMins / 60);
    const m = totalMins % 60;
    if (h > 0 && m > 0) return `${h} ساعة و ${m} دقيقة`;
    if (h > 0) return `${h} ساعة`;
    return `${m} دقيقة`;
}

function updateUI() {
    if (isNaN(remainingTotalMins)) remainingTotalMins = 1320;
    document.getElementById('remainingPermitsDisplay').innerText = formatMinutesToReadable(remainingTotalMins);

    const tbody = document.getElementById('permitsTableBody');
    tbody.innerHTML = '';
    permitsList.forEach((p, index) => {
        tbody.innerHTML += `
            <tr>
                <td>${p.date}</td>
                <td>${formatMinutesToReadable(p.totalMins)}</td>
                <td>
                    <button class="edit-btn" onclick="editPermit(${index})">✏️</button>
                    <button class="delete-btn" onclick="deletePermit(${index})">🗑️</button>
                </td>
            </tr>
        `;
    });
}

window.addPermit = async function() {
    const minsInput = document.getElementById('permitMinutes').value;
    const selectedDate = document.getElementById('permitDateInput').value;

    if (!minsInput || Number(minsInput) <= 0) {
        alert('الرجاء إدخال عدد دقايق صحيح للتصريح!');
        return;
    }

    const permitMins = Number(minsInput);
    if (permitMins > remainingTotalMins) {
        alert(`❌ رصيد التصاريح المتبقي لا يكفي!\nالرصيد الحالي هو ${formatMinutesToReadable(remainingTotalMins)} فقط.`);
        return;
    }

    remainingTotalMins -= permitMins;

    let dateStr = selectedDate;
    if (selectedDate) {
        const dObj = new Date(selectedDate);
        dateStr = dObj.toLocaleDateString('ar-SA', { year: 'numeric', month: 'numeric', day: 'numeric' });
    }

    permitsList.push({ date: dateStr, totalMins: permitMins });
    document.getElementById('permitMinutes').value = '';

    updateUI();
    await saveDataToCloud();
    alert('تم حفظ وخصم التصريح بنجاح!');
}

window.editPermit = async function(index) {
    const oldMins = permitsList[index].totalMins;
    const newMinsInput = prompt('أدخل عدد الدقائق الجديد للتصريح:', oldMins);
    if (!newMinsInput || Number(newMinsInput) <= 0) return;

    const newMins = Number(newMinsInput);
    const diffMins = newMins - oldMins;

    if (diffMins > remainingTotalMins) {
        alert('رصيد التصاريح المتبقي لا يكفي لهذا التعديل!');
        return;
    }

    remainingTotalMins -= diffMins;
    permitsList[index].totalMins = newMins;

    updateUI();
    await saveDataToCloud();
}

window.deletePermit = async function(index) {
    if (confirm('هل أنت متأكد من حذف هذا التصريح؟ (ستعود الدقائق لرصيد التصاريح العام)')) {
        const restoredMins = Number(permitsList[index].totalMins);
        remainingTotalMins = Number(remainingTotalMins) + restoredMins;
        if (remainingTotalMins > 1320) remainingTotalMins = 1320;

        permitsList.splice(index, 1);
        updateUI();
        await saveDataToCloud();
    }
}

window.startApp = function() {
    loadDataFromCloud();
};

if (window.isFirebaseReady) {
    window.startApp();
}
</script>

</body>
</html>
