<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #f0f2f5;
            text-align: right;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:hover { background-color: #2471a3; }
    </style>
</head>
<body>

<div class="container">
    <h2>تسجيل الدخول</h2>
    <div class="form-group">
        <label>اسم المستخدم:</label>
        <input type="text" id="username" placeholder="أدخل اسم المستخدم">
    </div>
    <div class="form-group">
        <label>كلمة المرور:</label>
        <input type="password" id="password" placeholder="أدخل كلمة المرور">
    </div>
    <button class="login-btn" onclick="login()">دخول</button>
</div>

<script>
function login() {
    // يمكنك تعديل شروط التحقق حسب رغبتك، حالياً يسمح بالدخول مباشرة
    localStorage.setItem('isLoggedIn', 'true');
    window.location.href = 'home.html';
}
</script>

</body>
</html>
