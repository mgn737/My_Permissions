<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الرئيسية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 25px; }
        .action-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            transition: background 0.3s;
        }
        .action-btn:hover { background-color: #2980b9; }
        .btn-delay { background-color: #e67e22; }
        .btn-delay:hover { background-color: #d35400; }
        .logout-btn {
            background-color: #e74c3c;
            margin-top: 25px;
        }
        .logout-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة التحكم والخدمات</h2>
    
    <a href="dashboard.html" class="action-btn">إدارة التصاريح الشهرية</a>
    <a href="delay.html" class="action-btn btn-delay">إدارة التأخير وسجلاته</a>
    
    <button class="action-btn logout-btn" onclick="logout()">تسجيل الخروج</button>
</div>

<script>
// حماية الصفحة: إذا لم يكن مسجلاً دخوله، يُطرد إلى صفحة الدخول
if (localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = 'login.html';
}

function logout() {
    localStorage.removeItem('isLoggedIn');
    localStorage.removeItem('currentUser');
    window.location.href = 'index.html';
}
</script>

</body>
</html>
