<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة التصاريح</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .action-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            transition: background 0.3s;
        }
        .action-btn:hover { background-color: #2980b9; }
        
        /* تنسيق شاشة التحميل */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loader">
        <div class="spinner"></div>
        <p>جاري التحميل...</p>
    </div>

    <!-- المحتوى الأصلي -->
    <div class="container" id="content" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <span style="font-size: 18px; font-weight: bold; color: #2c3e50;">الرئيسية</span>
            <a href="login.html" style="text-decoration: none; background: #2ecc71; color: white; padding: 8px 12px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;">👤</a>
        </div>
        
        <p style="color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.5;">
            مرحباً بك في نظام إدارة التصاريح. الرجاء تسجيل الدخول للوصول للخدمات، أو استخدام الحاسبة للزوار.
        </p>

        <a href="calculator.html" class="action-btn">حاسبة وقت الخروج المتاحة 🧮</a>
    </div>

    <script>
        // إخفاء شاشة التحميل بعد ثانيتين وإظهار المحتوى
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            }, 2000);
        });
    </script>

</body>
</html>
