<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة وقت الخروج (التصاريح)</title>
    <style>
        /* المتغيرات الأساسية (الوضع النهاري) */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --input-bg: #f0f2f5;
            --input-border: #ccc;
            --result-bg: #e8f6f3;
            --title-color: #2c3e50;
            --label-color: #333;
            --highlight-color: #d35400;
            --error-color: #e74c3c;
        }

        /* المتغيرات للوضع الليلي */
        .dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --input-bg: #2c2c2c;
            --input-border: #444;
            --result-bg: #0b2b26;
            --title-color: #e0e0e0;
            --label-color: #ccc;
            --highlight-color: #f39c12;
            --error-color: #ff6b6b;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            transition: background-color 0.3s;
        }
        
        /* تنسيق زر النمط الليلي أعلى النافذة */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .theme-btn {
            background-color: #f39c12;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            width: auto;
            margin-top: 0;
            transition: 0.3s;
        }

        .logo {
            display: block;
            margin: 0 auto 15px auto;
            max-width: 120px;
            height: auto;
            border-radius: 8px;
        }
        h2 {
            text-align: center;
            color: var(--title-color);
            margin-bottom: 20px;
            font-size: 20px;
            transition: color 0.3s;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--label-color);
            font-weight: bold;
            font-size: 13px;
            text-align: right;
            transition: color 0.3s;
        }
        /* تصغير الخانات وجعلها متناسقة على اليمين */
        input[type="time"], select {
            width: 50%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: var(--input-bg);
            color: var(--text-color);
            text-align: right;
            display: block;
            margin-right: 0;
            margin-left: auto;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: var(--input-bg);
            color: var(--text-color);
            text-align: right;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        .permit-group {
            display: flex;
            gap: 10px;
        }
        .permit-group .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1f618d;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--result-bg);
            border-right: 5px solid #1abc9c;
            border-radius: 4px;
            display: none;
            text-align: right;
            transition: background-color 0.3s;
        }
        .result-box p {
            margin: 8px 0;
            font-size: 14px;
            line-height: 1.6;
        }
        .highlight {
            font-weight: bold;
            color: var(--highlight-color);
            transition: color 0.3s;
        }
    </style>
</head>
<body>

<!-- سكريبت صغير يشتغل فوراً لمنع الشاشة البيضاء عند التحديث إذا كان الوضع الليلي مفعل -->
<script>
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
</script>

<div class="container">
    <div class="top-bar">
        <button id="themeToggleBtn" class="theme-btn" onclick="toggleTheme()">🌙 ليلي</button>
    </div>
    
    <img src="IMG_3974.jpeg" class="logo" alt="شعار">
    <h2>حاسبة وقت الخروج (التصاريح)</h2>
    
    <div class="form-group">
        <label for="calcType">طريقة الحساب:</label>
        <select id="calcType">
            <option value="1">يوم واحد</option>
            <option value="2">يومين</option>
        </select>
    </div>

    <div class="form-group">
        <label for="startTime">بداية الشفت (متى تداوم):</label>
        <input type="time" id="startTime" required>
    </div>

    <div class="form-group">
        <label for="endTime">نهاية الشفت المعتاد:</label>
        <input type="time" id="endTime" required>
    </div>

    <div class="form-group">
        <label>رصيد التصريح المراد استخدامه:</label>
        <div class="permit-group">
            <div class="form-group">
                <input type="number" id="permitHours" placeholder="ساعات (مثال: 2)" min="0" max="24">
            </div>
            <div class="form-group">
                <input type="number" id="permitMinutes" placeholder="دقائق (مثال: 30)" min="0" max="59">
            </div>
        </div>
    </div>

    <button onclick="calculateExitTime()">احسب وقت الخروج</button>

    <div class="result-box" id="resultBox">
        <p id="resultText"></p>
    </div>
</div>

<script>
// إعداد وتشغيل النمط الليلي/النهاري
function initThemeBtn() {
    const isDark = document.body.classList.contains('dark-mode');
    const btn = document.getElementById('themeToggleBtn');
    if (btn) {
        btn.innerHTML = isDark ? '☀️ نهاري' : '🌙 ليلي';
        btn.style.backgroundColor = isDark ? '#2c3e50' : '#f39c12';
    }
}

window.toggleTheme = function() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    initThemeBtn();
}

initThemeBtn();

// حاسبة وقت الخروج
function format12Hour(totalMins) {
    let hours24 = Math.floor((totalMins / 60) % 24);
    let mins = totalMins % 60;
    let period = hours24 >= 12 ? 'م' : 'ص';
    let hours12 = hours24 % 12;
    hours12 = hours12 ? hours12 : 12; // الساعة 12 بدلاً من 0
    return `${hours12}:${String(mins).padStart(2, '0')} ${period}`;
}

function calculateExitTime() {
    const type = document.getElementById('calcType').value;
    const startTimeVal = document.getElementById('startTime').value;
    const endTimeVal = document.getElementById('endTime').value;
    const pHours = parseInt(document.getElementById('permitHours').value) || 0;
    const pMinutes = parseInt(document.getElementById('permitMinutes').value) || 0;
    
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');

    if (!startTimeVal || !endTimeVal) {
        alert('الرجاء إدخال وقت بداية ونهاية الشفت');
        return;
    }

    const [startH, startM] = startTimeVal.split(':').map(Number);
    const [endH, endM] = endTimeVal.split(':').map(Number);
    
    let startTotalMins = startH * 60 + startM;
    let endTotalMins = endH * 60 + endM;
    const permitTotalMins = pHours * 60 + pMinutes;

    // معالجة الشفتات الليلية (تتجاوز منتصف الليل)
    if (endTotalMins <= startTotalMins) {
        endTotalMins += 24 * 60;
    }

    const singleShiftMins = endTotalMins - startTotalMins;

    if (type === '1') {
        // نظام يوم واحد
        if (permitTotalMins > singleShiftMins) {
            resultText.innerHTML = `<span class="highlight" style="color: var(--error-color);">عذراً، رصيد التصريح المدخل أكبر من إجمالي ساعات الشفت الواحد!</span>`;
        } else {
            const actualWorkMins = singleShiftMins - permitTotalMins;
            const exitTotalMins = startTotalMins + actualWorkMins;

            const formattedExit = format12Hour(exitTotalMins);
            const actH = Math.floor(actualWorkMins / 60);
            const actM = actualWorkMins % 60;

            resultText.innerHTML = `
                وقت الخروج بعد خصم التصريح: <span class="highlight">${formattedExit}</span><br>
                ساعات العمل الفعلية للدوام: <span class="highlight">${actH} ساعة و ${actM} دقيقة</span>
            `;
        }
    } else {
        // نظام يومين (تغطية اليوم الثاني بالكامل)
        const day2CoverMins = singleShiftMins;

        if (permitTotalMins < day2CoverMins) {
            // إذا كان التصريح أقل من شفت اليوم الثاني، فلا يمكن تغطيته
            const requiredHours = Math.floor(day2CoverMins / 60);
            const requiredMins = day2CoverMins % 60;
            resultText.innerHTML = `<span class="highlight" style="color: var(--error-color);">عذراً، رصيد التصريح المدخل لا يكفي لتغطية اليوم الثاني بالكامل. تحتاج على الأقل لـ ${requiredHours} ساعة و ${requiredMins} دقيقة.</span>`;
        } else {
            // إذا كان التصريح أكبر من أو يساوي شفت اليوم الثاني
            const remainingPermitMins = permitTotalMins - day2CoverMins;
            
            if (remainingPermitMins >= singleShiftMins) {
                 resultText.innerHTML = `<span class="highlight" style="color: var(--error-color);">عذراً، رصيد التصريح المدخل يغطي يومين بالكامل أو أكثر! لا داعي للحضور أساساً.</span>`;
            } else {
                const day1WorkMins = singleShiftMins - remainingPermitMins;
                const exitTotalMins = startTotalMins + day1WorkMins;
                const formattedExit = format12Hour(exitTotalMins);

                const d1H = Math.floor(day1WorkMins / 60);
                const d1M = day1WorkMins % 60;

                resultText.innerHTML = `
                    وقت الخروج في اليوم الأول: <span class="highlight">${formattedExit}</span><br>
                    ساعات العمل في اليوم الأول: <span class="highlight">${d1H} ساعة و ${d1M} دقيقة</span><br>
                    اليوم الثاني: <span class="highlight">بصم واطلع</span><br>
                    ساعات العمل في اليوم الثاني: <span class="highlight">لا يوجد (مغطى بالتصريح)</span>
                `;
            }
        }
    }

    resultBox.style.display = 'block';
}
</script>

</body>
</html>
