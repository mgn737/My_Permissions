<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة وقت الخروج (التصاريح)</title>
    <style>
        :root {
            /* ألوان الوضع النهاري (الافتراضي) */
            --bg-color: #f4f7f6;
            --container-bg: #fff;
            --text-color: #333;
            --title-color: #2c3e50;
            --input-bg: #f0f2f5;
            --input-border: #ccc;
            --btn-bg: #2980b9;
            --btn-hover: #1f618d;
            --result-bg: #e8f6f3;
            --result-border: #1abc9c;
            --highlight-color: #d35400;
            --icon-color: #2c3e50;
        }

        /* ألوان الوضع الليلي (أزرق ليلي) */
        body.dark-mode {
            --bg-color: #0b1325; /* أزرق ليلي غامق جداً للخلفية */
            --container-bg: #152238; /* أزرق ليلي للحاوية */
            --text-color: #e2e8f0;
            --title-color: #f8fafc;
            --input-bg: #1e2f4d; /* أزرق فاتح قليلاً للخانات */
            --input-border: #2a4365;
            --btn-bg: #3b82f6;
            --btn-hover: #2563eb;
            --result-bg: #1e2f4d;
            --result-border: #3b82f6;
            --highlight-color: #fbd38d; /* لون برتقالي/ذهبي متناسق مع الأزرق */
            --icon-color: #f8fafc;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* زر الوضع الليلي/النهاري */
        .theme-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--icon-color);
            padding: 5px;
            transition: transform 0.2s ease, color 0.3s ease;
        }
        .theme-toggle:hover {
            transform: scale(1.1);
        }
        .theme-toggle svg {
            width: 28px;
            height: 28px;
        }

        .container {
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
        .logo {
            display: block;
            margin: 0 auto 15px auto;
            max-width: 120px;
            height: auto;
            border-radius: 8px;
        }
        h2 {
            text-align: center;
            color: var(--title-color);
            margin-bottom: 20px;
            font-size: 20px;
            transition: color 0.3s ease;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-color);
            font-weight: bold;
            font-size: 13px;
            text-align: right;
        }
        input[type="time"], select {
            width: 50%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: var(--input-bg);
            color: var(--text-color);
            text-align: right;
            display: block;
            margin-right: 0;
            margin-left: auto;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: var(--input-bg);
            color: var(--text-color);
            text-align: right;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
        .permit-group {
            display: flex;
            gap: 10px;
        }
        .permit-group .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        
        /* كلاس خاص بزر الحساب حتى لا يتأثر زر الليلي */
        .calc-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }
        .calc-btn:hover {
            background-color: var(--btn-hover);
        }
        
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--result-bg);
            border-right: 5px solid var(--result-border);
            border-radius: 4px;
            display: none;
            text-align: right;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .result-box p {
            margin: 8px 0;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-color);
        }
        .highlight {
            font-weight: bold;
            color: var(--highlight-color);
        }
    </style>
</head>
<body>

<!-- زر التبديل بين الليل والنهار -->
<button class="theme-toggle" onclick="toggleTheme()" title="تبديل المظهر">
    <!-- أيقونة القمر (للوضع النهاري) -->
    <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
    </svg>
    <!-- أيقونة الشمس (للوضع الليلي) -->
    <svg id="sun-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
    </svg>
</button>

<div class="container">
    <img src="IMG_3974.jpeg" class="logo" alt="شعار">
    <h2>حاسبة وقت الخروج (التصاريح)</h2>
    
    <div class="form-group">
        <label for="calcType">طريقة الحساب:</label>
        <select id="calcType">
            <option value="1">يوم واحد</option>
            <option value="2">يومين</option>
        </select>
    </div>

    <div class="form-group">
        <label for="startTime">بداية الشفت (متى تداوم):</label>
        <input type="time" id="startTime" required>
    </div>

    <div class="form-group">
        <label for="endTime">نهاية الشفت المعتاد:</label>
        <input type="time" id="endTime" required>
    </div>

    <div class="form-group">
        <label>رصيد التصريح المراد استخدامه:</label>
        <div class="permit-group">
            <div class="form-group">
                <input type="number" id="permitHours" placeholder="ساعات (مثال: 2)" min="0" max="24">
            </div>
            <div class="form-group">
                <input type="number" id="permitMinutes" placeholder="دقائق (مثال: 30)" min="0" max="59">
            </div>
        </div>
    </div>

    <button class="calc-btn" onclick="calculateExitTime()">احسب وقت الخروج</button>

    <div class="result-box" id="resultBox">
        <p id="resultText"></p>
    </div>
</div>

<script>
// دالة تبديل الوضع الليلي
function toggleTheme() {
    const body = document.body;
    body.classList.toggle('dark-mode');
    
    const isDark = body.classList.contains('dark-mode');
    document.getElementById('moon-icon').style.display = isDark ? 'none' : 'block';
    document.getElementById('sun-icon').style.display = isDark ? 'block' : 'none';
}

function format12Hour(totalMins) {
    let hours24 = Math.floor((totalMins / 60) % 24);
    let mins = totalMins % 60;
    let period = hours24 >= 12 ? 'م' : 'ص';
    let hours12 = hours24 % 12;
    hours12 = hours12 ? hours12 : 12; // الساعة 12 بدلاً من 0
    return `${hours12}:${String(mins).padStart(2, '0')} ${period}`;
}

function calculateExitTime() {
    const type = document.getElementById('calcType').value;
    const startTimeVal = document.getElementById('startTime').value;
    const endTimeVal = document.getElementById('endTime').value;
    const pHours = parseInt(document.getElementById('permitHours').value) || 0;
    const pMinutes = parseInt(document.getElementById('permitMinutes').value) || 0;
    
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');

    if (!startTimeVal || !endTimeVal) {
        alert('الرجاء إدخال وقت بداية ونهاية الشفت');
        return;
    }

    const [startH, startM] = startTimeVal.split(':').map(Number);
    const [endH, endM] = endTimeVal.split(':').map(Number);
    
    let startTotalMins = startH * 60 + startM;
    let endTotalMins = endH * 60 + endM;
    const permitTotalMins = pHours * 60 + pMinutes;

    // معالجة الشفتات الليلية (تتجاوز منتصف الليل)
    if (endTotalMins <= startTotalMins) {
        endTotalMins += 24 * 60;
    }

    const singleShiftMins = endTotalMins - startTotalMins;

    if (type === '1') {
        // نظام يوم واحد
        if (permitTotalMins > singleShiftMins) {
            resultText.innerHTML = `<span class="highlight" style="color:#e74c3c;">عذراً، رصيد التصريح المدخل أكبر من إجمالي ساعات الشفت الواحد!</span>`;
        } else {
            const actualWorkMins = singleShiftMins - permitTotalMins;
            const exitTotalMins = startTotalMins + actualWorkMins;

            const formattedExit = format12Hour(exitTotalMins);
            const actH = Math.floor(actualWorkMins / 60);
            const actM = actualWorkMins % 60;

            resultText.innerHTML = `
                وقت الخروج بعد خصم التصريح: <span class="highlight">${formattedExit}</span><br>
                ساعات العمل الفعلية للدوام: <span class="highlight">${actH} ساعة و ${actM} دقيقة</span>
            `;
        }
    } else {
        // نظام يومين (تغطية اليوم الثاني بالكامل)
        const day2CoverMins = singleShiftMins;

        if (permitTotalMins < day2CoverMins) {
            // إذا كان التصريح أقل من شفت اليوم الثاني، فلا يمكن تغطيته
            const requiredHours = Math.floor(day2CoverMins / 60);
            const requiredMins = day2CoverMins % 60;
            resultText.innerHTML = `<span class="highlight" style="color:#e74c3c;">عذراً، رصيد التصريح المدخل لا يكفي لتغطية اليوم الثاني بالكامل. تحتاج على الأقل لـ ${requiredHours} ساعة و ${requiredMins} دقيقة.</span>`;
        } else {
            // إذا كان التصريح أكبر من أو يساوي شفت اليوم الثاني
            const remainingPermitMins = permitTotalMins - day2CoverMins;
            
            if (remainingPermitMins >= singleShiftMins) {
                 resultText.innerHTML = `<span class="highlight" style="color:#e74c3c;">عذراً، رصيد التصريح المدخل يغطي يومين بالكامل أو أكثر! لا داعي للحضور أساساً.</span>`;
            } else {
                const day1WorkMins = singleShiftMins - remainingPermitMins;
                const exitTotalMins = startTotalMins + day1WorkMins;
                const formattedExit = format12Hour(exitTotalMins);

                const d1H = Math.floor(day1WorkMins / 60);
                const d1M = day1WorkMins % 60;

                resultText.innerHTML = `
                    وقت الخروج في اليوم الأول: <span class="highlight">${formattedExit}</span><br>
                    ساعات العمل في اليوم الأول: <span class="highlight">${d1H} ساعة و ${d1M} دقيقة</span><br>
                    اليوم الثاني: <span class="highlight">بصم واطلع</span><br>
                    ساعات العمل في اليوم الثاني: <span class="highlight">لا يوجد (مغطى بالتصريح)</span>
                `;
            }
        }
    }

    resultBox.style.display = 'block';
}
</script>

</body>
</html>
