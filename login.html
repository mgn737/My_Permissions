<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة التصاريح</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --title-color: #2c3e50;
            --input-bg: #f0f2f5;
            --input-border: #ccc;
        }

        .dark-mode {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --card-bg: #1e293b;
            --title-color: #f8fafc;
            --input-bg: #0f172a;
            --input-border: #475569;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }
        .login-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            transition: background-color 0.3s;
        }

        .theme-icon-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.3s;
        }
        .theme-icon-btn:hover {
            background-color: rgba(0,0,0,0.1);
        }
        .dark-mode .theme-icon-btn:hover {
            background-color: rgba(255,255,255,0.1);
        }

        h2 { color: var(--title-color); margin-bottom: 20px; font-size: 20px; transition: color 0.3s; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: var(--text-color); transition: color 0.3s; }
        input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            box-sizing: border-box;
            background-color: var(--input-bg);
            color: var(--text-color);
            text-align: right;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .login-btn:hover { background-color: #219653; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<script>
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
</script>

<div class="login-card">
    <button id="themeToggleBtn" class="theme-icon-btn" onclick="toggleTheme()" title="تغيير المظهر">🌙</button>
    <h2>تسجيل الدخول لنظام التصاريح</h2>
    <div class="form-group">
        <label>اسم المستخدم:</label>
        <input type="text" id="usernameInput" placeholder="أدخل اسم المستخدم">
    </div>
    <div class="form-group">
        <label>كلمة المرور:</label>
        <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور">
    </div>
    <button class="login-btn" onclick="login()">دخول</button>
    <p id="errorMsg" class="error-msg">اسم المستخدم أو كلمة المرور غير صحيحة!</p>
</div>

<script>
function initThemeBtn() {
    const isDark = document.body.classList.contains('dark-mode');
    const btn = document.getElementById('themeToggleBtn');
    if (btn) {
        btn.innerHTML = isDark ? '☀️' : '🌙';
    }
}

window.toggleTheme = function() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    initThemeBtn();
}

initThemeBtn();

function login() {
    const user = document.getElementById('usernameInput').value.trim();
    const pass = document.getElementById('passwordInput').value.trim();
    
    const usersDb = {
        "Fahad": "1606",
        "Ahmed": "ahha2020",
        "admin": "ahha41007"
    };

    if (usersDb[user] && usersDb[user] === pass) {
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('currentUser', user); 
        window.location.href = 'home.html';
    } else {
        document.getElementById('errorMsg').style.display = 'block';
    }
}
</script>

</body>
</html>
