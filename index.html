<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - النظام</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        
        /* تصميم شاشة التحميل مع الصورة */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loader-logo {
            width: 120px; /* يمكنك تعديل حجم الصورة من هنا */
            height: auto;
            margin-bottom: 20px;
            border-radius: 15px; /* حواف دائرية للصورة */
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* ظل خفيف للصورة */
        }
        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            width: 40px; height: 40px;
            border-radius: 50%;
            border-left-color: #27ae60;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* تصميم الحاوية الرئيسية */
        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            display: none; /* مخفية حتى ينتهي التحميل */
        }
        
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h2 { color: #2c3e50; font-size: 18px; margin: 0; }
        
        /* زر الأيقونة لتسجيل الدخول */
        .login-icon-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%; /* لجعل الزر دائري */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s;
        }
        .login-icon-btn:hover { 
            background-color: #219653; 
            transform: scale(1.05);
        }
        .login-icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .back-btn {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 15px;
            display: inline-block;
        }
        
        /* أزرار وحقول الحاسبة */
        .main-menu-btn {
            width: 100%;
            padding: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .main-menu-btn:hover { background-color: #2980b9; }

        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        select, input {
            width: 100%;
            padding: 9px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #f0f2f5;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            background-color: #f39c12;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .action-btn:hover { background-color: #d35400; }
        
        .result-box {
            background-color: #fef9e7;
            border: 1px solid #f39c12;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            text-align: right;
            display: none;
        }
        .result-box p { margin: 6px 0; font-size: 13px; color: #2c3e50; }
    </style>
</head>
<body>

<!-- شاشة التحميل مع الصورة المخصصة -->
<div id="loader">
    <!-- الصورة الخاصة بك -->
    <img src="IMG_3974.jpeg" alt="شعار النظام" class="loader-logo" onerror="this.style.display='none'">
    
    <div class="spinner"></div>
    <h3 style="color: #2c3e50; margin-top: 10px;">جاري التحميل...</h3>
</div>

<!-- المحتوى الرئيسي (يظهر بعد التحميل) -->
<div class="container" id="mainContent">
    
    <div class="header-flex">
        <!-- زر تسجيل الدخول (أيقونة) -->
        <a href="login.html" class="login-icon-btn" id="authBtn" title="تسجيل الدخول / لوحة التحكم">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </a>
        <h2 id="pageTitle">الرئيسية</h2>
    </div>

    <!-- قائمة الزوار (الواجهة الأولى) -->
    <div id="menuView">
        <p style="text-align: center; color: #7f8c8d; font-size: 14px;">مرحباً بك في نظام إدارة التصاريح. الرجاء تسجيل الدخول للوصول للخدمات، أو استخدام الحاسبة للزوار.</p>
        <button class="main-menu-btn" onclick="showCalculator()">🧮 حاسبة وقت الخروج المتاحة</button>
    </div>

    <!-- واجهة الحاسبة (تظهر عند الضغط على الزر) -->
    <div id="calculatorView" style="display: none;">
        <button class="back-btn" onclick="showMenu()">🔙 رجوع للقائمة</button>
        
        <div class="form-group">
            <label>تاريخ البدء:</label>
            <input type="date" id="calcDateInput">
        </div>

        <div class="form-group">
            <label>فترة العمل (الشفت):</label>
            <select id="calcShiftSelect" onchange="toggleCalcCustomShift()">
                <option value="07:15-15:15">الفترة الأولى (7:15 ص - 3:15 م)</option>
                <option value="05:00-13:00">الفترة الثانية (5 ص - 1 م)</option>
                <option value="22:00-06:00">الفترة الثالثة (10 م - 6 ص)</option>
                <option value="00:00-08:00">الفترة الرابعة (12 ص - 8 ص)</option>
                <option value="custom">مخصص (تحديد يدوي)</option>
            </select>
        </div>

        <div id="calcCustomShiftBox" style="display: none; margin-bottom: 15px;">
            <div style="display: flex; gap: 10px; width: 100%;">
                <div style="flex:1;"><label>بداية:</label><input type="time" id="calcCustomStart" value="07:15"></div>
                <div style="flex:1;"><label>نهاية:</label><input type="time" id="calcCustomEnd" value="15:15"></div>
            </div>
        </div>

        <div class="form-group">
            <label>الرصيد المراد حسابه:</label>
            <select id="inputHours">
                <option value="8">8 ساعات (رصيد التأخير)</option>
                <option value="22" selected>22 ساعة (رصيد التصاريح كامل)</option>
            </select>
        </div>

        <button class="action-btn" onclick="calculateInfo()">احسب وقت الخروج</button>

        <div id="calcResultBox" class="result-box">
            <p id="resText1"></p>
            <p id="resText2"></p>
        </div>
    </div>

</div>

<script>
// إعداد التاريخ الافتراضي لليوم
document.getElementById('calcDateInput').valueAsDate = new Date();

// التعامل مع شاشة التحميل والتوجيه
window.addEventListener('load', () => {
    setTimeout(() => {
        // إخفاء شاشة التحميل بعد ثانيتين وإظهار المحتوى
        document.getElementById('loader').style.display = 'none';
        
        // التحقق: إذا كان مسجل دخوله مسبقاً، وجهه فوراً للوحة التحكم الخاصة
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'home.html';
        } else {
            // إذا لم يكن مسجل دخول، أظهر له الشاشة الرئيسية للزوار
            document.getElementById('mainContent').style.display = 'block';
        }
    }, 2000); // 2000 ملي ثانية = ثانيتين
});

// دوال التنقل بين الواجهات
function showCalculator() {
    document.getElementById('menuView').style.display = 'none';
    document.getElementById('calculatorView').style.display = 'block';
    document.getElementById('pageTitle').innerText = 'حاسبة وقت الخروج';
}

function showMenu() {
    document.getElementById('calculatorView').style.display = 'none';
    document.getElementById('menuView').style.display = 'block';
    document.getElementById('pageTitle').innerText = 'الرئيسية';
}

// دوال الحاسبة
function toggleCalcCustomShift() {
    const val = document.getElementById('calcShiftSelect').value;
    document.getElementById('calcCustomShiftBox').style.display = (val === 'custom') ? 'flex' : 'none';
}

function getCalcShiftTimes() {
    const shiftVal = document.getElementById('calcShiftSelect').value;
    let start = "07:15", end = "15:15";
    if(shiftVal !== 'custom') {
        const parts = shiftVal.split('-');
        start = parts[0]; end = parts[1];
    } else {
        start = document.getElementById('calcCustomStart').value || "07:15";
        end = document.getElementById('calcCustomEnd').value || "15:15";
    }
    return { start, end };
}

function formatTime12h(timeStr) {
    if (!timeStr) return '';
    let [h, m] = timeStr.split(':').map(Number);
    let period = 'ص';
    if (h >= 12) {
        period = 'م';
        if (h > 12) h -= 12;
    }
    if (h === 0) h = 12;
    return `${h}:${String(m).padStart(2, '0')} ${period}`;
}

function formatMinutesToReadable(totalMins) {
    if (isNaN(totalMins) || totalMins <= 0) return "0 ساعة";
    const h = Math.floor(totalMins / 60);
    const m = totalMins % 60;
    if (h > 0 && m > 0) return `${h} ساعة و ${m} دقيقة`;
    if (h > 0) return `${h} ساعة`;
    return `${m} دقيقة`;
}

function calculateInfo() {
    const times = getCalcShiftTimes();
    const [startH, startM] = times.start.split(':').map(Number);
    const [endH, endM] = times.end.split(':').map(Number);
    
    let startTotalMins = startH * 60 + startM;
    let endTotalMins = endH * 60 + endM;
    if (endTotalMins < startTotalMins) endTotalMins += 24 * 60;
    
    const shiftTotalMins = endTotalMins - startTotalMins;
    const targetMins = document.getElementById('inputHours').value === '8' ? 480 : 1320;

    const selectedDate = document.getElementById('calcDateInput').value;
    let dObj = selectedDate ? new Date(selectedDate) : new Date();
    let dateStr1 = dObj.toLocaleDateString('ar-SA', { year: 'numeric', month: 'numeric', day: 'numeric' });

    const resultBox = document.getElementById('calcResultBox');
    const p1 = document.getElementById('resText1');
    const p2 = document.getElementById('resText2');

    if (targetMins > shiftTotalMins) {
        const remainder = targetMins - shiftTotalMins;
        let dObj2 = new Date(dObj);
        dObj2.setDate(dObj2.getDate() + 1);
        let dateStr2 = dObj2.toLocaleDateString('ar-SA', { year: 'numeric', month: 'numeric', day: 'numeric' });

        p1.innerHTML = `📌 <b>اليوم الأول (${dateStr1}):</b> تدوام الشفت كامل وتستنفد جزءاً من الرصيد.`;
        p2.innerHTML = `📌 <b>اليوم الثاني (${dateStr2}):</b> تحتاج استئذان أو خصم ما يعادل <b>${formatMinutesToReadable(remainder)}</b>.`;
        p2.style.display = 'block';
    } else {
        const workMinsDay1 = shiftTotalMins - targetMins;
        let exit1TotalMins = (startTotalMins + workMinsDay1) % (24 * 60);
        let ex1H = Math.floor(exit1TotalMins / 60);
        let ex1M = exit1TotalMins % 60;
        let exit1Str = formatTime12h(`${String(ex1H).padStart(2,'0')}:${String(ex1M).padStart(2,'0')}`);

        p1.innerHTML = `📌 <b>في اليوم (${dateStr1}):</b> تدوام ${formatMinutesToReadable(workMinsDay1)} فقط ← وقت الخروج المسموح: <b>${exit1Str}</b>.`;
        p2.style.display = 'none';
    }

    resultBox.style.display = 'block';
}
</script>

</body>
</html>
