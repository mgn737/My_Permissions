<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الرئيسية</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --title-color: #2c3e50;
        }

        .dark-mode {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --card-bg: #1e293b;
            --title-color: #f8fafc;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            transition: background-color 0.3s;
        }
        
        .theme-icon-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.3s;
        }
        .theme-icon-btn:hover {
            background-color: rgba(0,0,0,0.1);
        }
        .dark-mode .theme-icon-btn:hover {
            background-color: rgba(255,255,255,0.1);
        }

        h2 { color: var(--title-color); margin-bottom: 25px; transition: color 0.3s; }
        
        .action-btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            transition: background 0.3s;
        }
        .action-btn:hover { background-color: #2980b9; }
        .btn-delay { background-color: #e67e22; }
        .btn-delay:hover { background-color: #d35400; }
        .btn-vacation { background-color: #9b59b6; }
        .btn-vacation:hover { background-color: #8e44ad; }
        .logout-btn {
            background-color: #e74c3c;
            margin-top: 25px;
        }
        .logout-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

<script>
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
</script>

<div class="container">
    <button id="themeToggleBtn" class="theme-icon-btn" onclick="toggleTheme()" title="تغيير المظهر">🌙</button>
    
    <h2>لوحة التحكم والخدمات</h2>
    
    <a href="dashboard.html" class="action-btn">إدارة التصاريح الشهرية</a>
    <a href="delay.html" class="action-btn btn-delay">إدارة التأخير وسجلاته</a>
    <a href="vacations.html" class="action-btn btn-vacation">إدارة الإجازات</a>
    
    <button class="action-btn logout-btn" onclick="logout()">تسجيل الخروج</button>
</div>

<script>
function initThemeBtn() {
    const isDark = document.body.classList.contains('dark-mode');
    const btn = document.getElementById('themeToggleBtn');
    if (btn) {
        btn.innerHTML = isDark ? '☀️' : '🌙';
    }
}

window.toggleTheme = function() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    initThemeBtn();
}

initThemeBtn();

if (localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = 'login.html';
}

function logout() {
    localStorage.removeItem('isLoggedIn');
    localStorage.removeItem('currentUser');
    window.location.href = 'index.html';
}
</script>

</body>
</html>
