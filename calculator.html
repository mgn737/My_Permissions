<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة وقت الخروج المتاحة</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --border-color: #eee;
            --input-bg: #f0f2f5;
            --input-border: #ccc;
            --title-color: #2c3e50;
            --result-bg: #ebf5fb;
            --result-border: #3498db;
        }

        .dark-mode {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --card-bg: #1e293b;
            --border-color: #334155;
            --input-bg: #0f172a;
            --input-border: #475569;
            --title-color: #f8fafc;
            --result-bg: #172554;
            --result-border: #3b82f6;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            transition: background-color 0.3s;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        h2 { color: var(--title-color); font-size: 18px; margin: 0; transition: color 0.3s; }
        
        .header-btns-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .back-btn {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            display: inline-block;
        }
        
        .theme-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.3s;
        }
        .theme-icon-btn:hover {
            background-color: rgba(0,0,0,0.1);
        }
        .dark-mode .theme-icon-btn:hover {
            background-color: rgba(255,255,255,0.1);
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; text-align: right; color: var(--text-color); transition: color 0.3s; }
        select, input {
            width: 100%;
            padding: 9px;
            font-size: 14px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            box-sizing: border-box;
            background-color: var(--input-bg);
            color: var(--text-color);
            text-align: right;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        
        .calc-btn {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.3s;
        }
        .calc-btn:hover { background-color: #2980b9; }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--result-bg);
            border: 1px solid var(--result-border);
            border-radius: 8px;
            text-align: center;
            display: none;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .result-box h3 { margin: 0 0 8px 0; color: var(--title-color); font-size: 15px; }
        .result-box p { font-size: 18px; font-weight: bold; color: #2980b9; margin: 0; }
        .dark-mode .result-box p { color: #60a5fa; }
    </style>
</head>
<body>

<script>
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }
</script>

<div class="container">
    <div class="header-flex">
        <!-- زر الرئيسية أصبح في اليمين -->
        <a href="index.html" class="back-btn">الرئيسية</a>
        
        <h2>حاسبة وقت الخروج المتاحة</h2>

        <!-- أيقونة تغيير المظهر أصبحت في اليسار -->
        <button id="themeToggleBtn" class="theme-icon-btn" onclick="toggleTheme()" title="تغيير المظهر">🌙</button>
    </div>

    <div class="form-group">
        <label>فترة العمل (الشفت):</label>
        <select id="shiftSelect" onchange="toggleCustomShift()">
            <option value="07:15-15:15">الفترة الأولى (7:15 ص - 3:15 م)</option>
            <option value="05:00-13:00">الفترة الثانية (5 ص - 1 م)</option>
            <option value="22:00-06:00">الفترة الثالثة (10 م - 6 ص)</option>
            <option value="00:00-08:00">الفترة الرابعة (12 ص - 8 ص)</option>
            <option value="custom">مخصص (تحديد يدوي)</option>
        </select>
    </div>

    <div id="customShiftBox" style="display: none; margin-bottom: 15px;">
        <div style="display: flex; gap: 10px; width: 100%;">
            <div style="flex:1;"><label>نهاية الشفت:</label><input type="time" id="customEnd" value="15:15"></div>
        </div>
    </div>

    <div class="form-group">
        <label>مدة الاستئذان المطلوبة (بالدقائق):</label>
        <input type="number" id="permitDuration" placeholder="مثال: 60" min="1" value="60">
    </div>

    <button class="calc-btn" onclick="calculateExitTime()">احسب وقت الخروج المناسب</button>

    <div id="resultBox" class="result-box">
        <h3>أقرب وقت متاح للخروج:</h3>
        <p id="resultText">-</p>
    </div>
</div>

<script>
function initThemeBtn() {
    const isDark = document.body.classList.contains('dark-mode');
    const btn = document.getElementById('themeToggleBtn');
    if (btn) {
        btn.innerHTML = isDark ? '☀️' : '🌙';
    }
}

window.toggleTheme = function() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    initThemeBtn();
}

initThemeBtn();

function toggleCustomShift() {
    const val = document.getElementById('shiftSelect').value;
    document.getElementById('customShiftBox').style.display = (val === 'custom') ? 'block' : 'none';
}

function calculateExitTime() {
    const shiftVal = document.getElementById('shiftSelect').value;
    let endTimeStr = "15:15";

    if (shiftVal !== 'custom') {
        endTimeStr = shiftVal.split('-')[1];
    } else {
        endTimeStr = document.getElementById('customEnd').value || "15:15";
    }

    const durationMins = Number(document.getElementById('permitDuration').value);
    if (!durationMins || durationMins <= 0) {
        alert('الرجاء إدخال مدة صحيحة بالدقائق!');
        return;
    }

    let [endH, endM] = endTimeStr.split(':').map(Number);
    let totalEndMins = endH * 60 + endM;

    let targetTotalMins = totalEndMins - durationMins;
    if (targetTotalMins < 0) targetTotalMins += 24 * 60;

    let finalH = Math.floor(targetTotalMins / 60);
    let finalM = targetTotalMins % 60;

    let period = 'ص';
    if (finalH >= 12) {
        period = 'م';
        if (finalH > 12) finalH -= 12;
    }
    if (finalH === 0) finalH = 12;

    const formattedTime = `${finalH}:${String(finalM).padStart(2, '0')} ${period}`;
    
    document.getElementById('resultText').innerText = `يمكنك الخروج ابتداءً من الساعة: ${formattedTime}`;
    document.getElementById('resultBox').style.display = 'block';
}
</script>

</body>
</html>
