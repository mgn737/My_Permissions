<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخدمات الالكترونية - الرئيسية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .menu-btn:hover {
            opacity: 0.9;
        }
        .btn-delay {
            background-color: #e67e22;
        }
        .logout-btn {
            background-color: #e74c3c;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>الخدمات الإلكترونية</h2>
    
    <!-- زر إدارة التصاريح الشهرية -->
    <a href="dashboard.html" class="menu-btn">إدارة التصاريح الشهرية</a>

    <!-- زر إدارة التأخير الجديد -->
    <a href="delay.html" class="menu-btn btn-delay">إدارة التأخير</a>

    <!-- زر تسجيل الخروج -->
    <button class="menu-btn logout-btn" onclick="logout()">تسجيل الخروج</button>
</div>

<script>
    // التحقق من تسجيل الدخول
    if (localStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = 'login.html';
    }

    function logout() {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('currentUser');
        window.location.href = 'login.html';
    }
</script>

</body>
</html>
