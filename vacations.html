<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الإجازات</title>
    <!-- استدعاء مكتبات Firebase السحابية -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD10nYcvOM_5s8Hd-MFe2lTsRqkJ7TQ4vA",
            authDomain: "my--permissions.firebaseapp.com",
            projectId: "my--permissions",
            storageBucket: "my--permissions.firebasestorage.app",
            messagingSenderId: "476127156640",
            appId: "1:476127156640:web:48f68b18dba796f1a2acc5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.doc = doc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;

        window.isFirebaseReady = true;
        if (typeof window.startApp === 'function') {
            window.startApp();
        }
    </script>

    <style>
        /* إضافة قاعدة عامة تجبر كل العناصر على الالتزام بحدودها */
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-box-sizing: border-box;
        }

        /* المتغيرات الأساسية (الوضع النهاري) */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --border-color: #eee;
            --input-bg: #f0f2f5;
            --input-border: #ccc;
            --date-box-bg: #e8f6f3;
            --date-box-text: #16a085;
            --title-color: #2c3e50;
            --icon-color: #2c3e50;
        }

        /* المتغيرات للوضع الليلي */
        .dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --input-bg: #2c2c2c;
            --input-border: #444;
            --date-box-bg: #0b2b26;
            --date-box-text: #48c9b0;
            --title-color: #e0e0e0;
            --icon-color: #f8fafc;
        }

        body { 
            font-family: Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 20px; 
            transition: background-color 0.3s, color 0.3s; 
            overflow-x: hidden; 
        }
        
        .header { display: flex; justify-content: space-between; background-color: var(--card-bg); padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; align-items: center; transition: background-color 0.3s; }
        .header-btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; text-decoration: none; font-size: 14px; }
        .logout-btn { background-color: #e74c3c; }
        .home-btn { background-color: #34495e; }
        
        /* تنسيق زر أيقونة المظهر */
        .theme-toggle-icon { 
            background: none; 
            border: none; 
            cursor: pointer; 
            color: var(--icon-color); 
            padding: 5px; 
            transition: transform 0.2s ease, color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle-icon:hover { transform: scale(1.1); }
        .theme-toggle-icon svg { width: 26px; height: 26px; }
        
        .balances-container { display: flex; gap: 20px; margin-bottom: 20px; }
        .balance-card { flex: 1; background: var(--card-bg); padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; transition: background-color 0.3s; }
        .balance-card h3 { margin: 0 0 10px 0; color: var(--title-color); font-size: 16px; transition: color 0.3s; }
        .balance-card .num { font-size: 32px; font-weight: bold; color: #27ae60; }
        .settings-icon { position: absolute; top: 10px; left: 10px; cursor: pointer; opacity: 0.3; transition: 0.3s; font-size: 18px; }
        .settings-icon:hover { opacity: 1; }

        .btn-main { background-color: #2980b9; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 20px; }
        .btn-main:hover { background-color: #217dbb; }
        
        .form-section, .settings-section { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: none; margin-bottom: 20px; border: 2px solid #3498db; transition: background-color 0.3s; }
        .settings-section h4 { color: var(--title-color); transition: color 0.3s; }
        .form-group { margin-bottom: 15px; text-align: right; width: 100%; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        
        .form-group select, .form-group input { 
            width: 100%; 
            max-width: 100%;
            padding: 10px; 
            margin: 0; 
            display: block; 
            border: 1px solid var(--input-border); 
            border-radius: 6px; 
            background-color: var(--input-bg); 
            color: var(--text-color);
            font-family: inherit;
            font-size: 14px;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
            -webkit-appearance: none; 
            appearance: none;
        }

        .form-group input[type="date"]::-webkit-calendar-picker-indicator {
            display: block;
            opacity: 1;
        }

        .date-display-box {
            background-color: var(--date-box-bg);
            border: 1px dashed var(--date-box-text);
            color: var(--date-box-text);
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 13px;
            text-align: center;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        
        .flex-btns { display: flex; gap: 10px; }
        .btn-submit { background-color: #27ae60; flex: 1; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-cancel { background-color: #95a5a6; flex: 1; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        h3 { color: var(--title-color); transition: color 0.3s; }

        table { width: 100%; background: var(--card-bg); border-collapse: collapse; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; margin-top: 10px; transition: background-color 0.3s; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { background-color: #34495e; color: white; }
        .action-icon { cursor: pointer; margin: 0 5px; font-size: 16px; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="header">
        <a href="home.html" class="header-btn home-btn">الرئيسية 🏠</a>
        
        <button class="theme-toggle-icon" onclick="toggleTheme()" title="تبديل المظهر">
            <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
            </svg>
            <svg id="sun-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        </button>
        
        <button class="header-btn logout-btn" onclick="logout()">تسجيل خروج</button>
    </div>

    <div class="balances-container">
        <div class="balance-card">
            <h3>رصيد الإجازات</h3>
            <div class="num" id="mainBalanceDisplay">...</div>
            <span class="settings-icon" onclick="toggleSettings()" title="إعدادات الرصيد">⚙️</span>
        </div>
        <div class="balance-card">
            <h3>الأيام المتفرقة</h3>
            <div class="num" id="scatBalanceDisplay" style="color: #f39c12;">...</div>
            <small style="color: #7f8c8d; display: block; margin-top: 5px; font-size: 11px;">تتجدد 1/1 هجري</small>
        </div>
    </div>

    <!-- نافذة الإعدادات المحدثة -->
    <div class="settings-section" id="settingsForm">
        <h4 style="margin-top: 0;">إعدادات الرصيد والتجديد</h4>
        
        <!-- تعديل الأرصدة يدوياً -->
        <div style="margin-bottom: 15px; border-bottom: 1px dashed var(--border-color); padding-bottom: 15px;">
            <label style="font-weight: bold; margin-bottom: 8px; display: block;">تعديل الأرصدة يدوياً:</label>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1; margin-bottom: 0;">
                    <label style="font-size: 11px; color: #7f8c8d;">الرصيد الأساسي:</label>
                    <input type="number" id="manualMainBalance" placeholder="مثال: 36">
                </div>
                <div class="form-group" style="flex: 1; margin-bottom: 0;">
                    <label style="font-size: 11px; color: #7f8c8d;">الأيام المتفرقة:</label>
                    <input type="number" id="manualScatBalance" placeholder="مثال: 10">
                </div>
            </div>
        </div>

        <!-- تاريخ التجديد السنوي الهجري -->
        <label style="font-weight: bold; margin-bottom: 8px; display: block;">تاريخ تجديد الرصيد السنوي (هجري):</label>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label style="font-size: 11px; color: #7f8c8d;">اليوم الهجري:</label>
                <input type="number" id="renewDay" min="1" max="30" placeholder="مثال: 1">
            </div>
            <div class="form-group" style="flex: 1; margin-bottom: 0;">
                <label style="font-size: 11px; color: #7f8c8d;">الشهر الهجري:</label>
                <input type="number" id="renewMonth" min="1" max="12" placeholder="مثال: 1">
            </div>
        </div>
        
        <button class="btn-submit" style="width: 100%;" onclick="saveSettings()">حفظ التعديلات</button>
    </div>

    <button class="btn-main" onclick="toggleLeaveForm()">➕ طلب إجازة</button>

    <div class="form-section" id="leaveForm">
        <div class="form-group">
            <label>نوع الإجازة:</label>
            <select id="leaveTypeInput">
                <option value="normal">إجازة اعتيادية</option>
                <option value="hospital">موعد مستشفى</option>
            </select>
        </div>

        <div class="form-group">
            <label>تاريخ بداية الإجازة:</label>
            <input type="date" id="leaveDateInput" onchange="updateDualDateDisplay()">
            <div id="dualDateDisplay" class="date-display-box">اختر التاريخ من التقويم أعلاه</div>
        </div>
        
        <div class="form-group">
            <label>عدد أيام الإجازة (1 - 100):</label>
            <select id="leaveDays"></select>
        </div>
        <div class="flex-btns">
            <button class="btn-submit" onclick="submitLeave()">رفع الإجازة</button>
            <button class="btn-cancel" onclick="toggleLeaveForm()">إلغاء</button>
        </div>
    </div>

    <h3 style="margin-bottom: 5px;">سجل الإجازات</h3>
    <table>
        <thead>
            <tr>
                <th>التاريخ</th>
                <th>اليوم (النوع)</th>
                <th>الأيام</th>
                <th>المباشرة</th>
                <th>إجراءات</th>
            </tr>
        </thead>
        <tbody id="leaveTableBody"></tbody>
    </table>

<script>
    if (localStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = 'login.html';
    }

    const currentUsername = localStorage.getItem('currentUser') || 'defaultUser';
    
    let mainBalance = 36;
    let scatBalance = 10;
    let renewSettings = { day: 1, month: 1 };
    let lastMainRenewYear = 0;
    let lastScatRenewYear = 0;
    let leavesHistory = [];
    let isDataLoaded = false;
    let selectedDateObj = null;

    function initThemeBtn() {
        const isDark = document.body.classList.contains('dark-mode');
        const moon = document.getElementById('moon-icon');
        const sun = document.getElementById('sun-icon');
        
        if (moon && sun) {
            moon.style.display = isDark ? 'none' : 'block';
            sun.style.display = isDark ? 'block' : 'none';
        }
    }
    
    window.toggleTheme = function() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        initThemeBtn();
    }
    
    initThemeBtn();

    const daysSelect = document.getElementById('leaveDays');
    for (let i = 1; i <= 100; i++) {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerText = i + (i === 1 ? ' يوم' : ' أيام');
        daysSelect.appendChild(opt);
    }

    function setInitialDate() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        document.getElementById('leaveDateInput').value = `${year}-${month}-${day}`;
        updateDualDateDisplay();
    }

    function updateDualDateDisplay() {
        const inputVal = document.getElementById('leaveDateInput').value;
        if (!inputVal) return;

        selectedDateObj = new Date(inputVal);

        const hFormatter = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { year: 'numeric', month: 'long', day: 'numeric' });
        const hFormatted = hFormatter.format(selectedDateObj);

        const displayBox = document.getElementById('dualDateDisplay');
        displayBox.innerHTML = `🌙 <b>التاريخ الهجري:</b> ${hFormatted}`;
    }

    setInitialDate();

    async function loadDataFromCloud() {
        if (!window.db || !window.doc) {
            setTimeout(loadDataFromCloud, 200);
            return;
        }

        try {
            const docRef = window.doc(window.db, "vacsData", currentUsername);
            const docSnap = await window.getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                mainBalance = data.mainBalance !== undefined ? Number(data.mainBalance) : 36;
                scatBalance = data.scatBalance !== undefined ? Number(data.scatBalance) : 10;
                renewSettings = data.renewSettings || { day: 1, month: 1 };
                lastMainRenewYear = data.lastMainRenewYear || 0;
                lastScatRenewYear = data.lastScatRenewYear || 0;
                leavesHistory = data.leavesHistory || [];
            } else {
                await window.setDoc(docRef, { mainBalance, scatBalance, renewSettings, lastMainRenewYear, lastScatRenewYear, leavesHistory }, { merge: true });
            }

            isDataLoaded = true;
            checkRenewals(); 
        } catch (e) {
            console.error("خطأ في جلب بيانات الإجازات:", e);
        }
    }

    async function saveDataToCloud() {
        try {
            if (!window.db || !window.doc) return;
            const docRef = window.doc(window.db, "vacsData", currentUsername);
            await window.setDoc(docRef, {
                mainBalance: Number(mainBalance),
                scatBalance: Number(scatBalance),
                renewSettings: renewSettings,
                lastMainRenewYear: lastMainRenewYear,
                lastScatRenewYear: lastScatRenewYear,
                leavesHistory: leavesHistory
            }, { merge: true });
        } catch (e) {
            console.error("خطأ في حفظ البيانات:", e);
        }
    }

    function getTodayHijri() {
        const today = new Date();
        const formatter = new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura', { year: 'numeric', month: 'numeric', day: 'numeric' });
        const parts = formatter.formatToParts(today);
        let hijri = {};
        parts.forEach(p => { if (p.type === 'year' || p.type === 'month' || p.type === 'day') hijri[p.type] = parseInt(p.value); });
        return hijri;
    }

    async function checkRenewals() {
        const hDate = getTodayHijri();
        let changed = false;
        
        if (lastScatRenewYear === 0) { lastScatRenewYear = hDate.year; changed = true; }
        if (hDate.year > lastScatRenewYear) {
            scatBalance = 10;
            lastScatRenewYear = hDate.year;
            changed = true;
        }

        if (lastMainRenewYear === 0) { 
            if (hDate.month < renewSettings.month || (hDate.month === renewSettings.month && hDate.day < renewSettings.day)) {
                lastMainRenewYear = hDate.year - 1; 
            } else {
                lastMainRenewYear = hDate.year; 
            }
            changed = true; 
        }

        if (hDate.year > lastMainRenewYear) {
            if (hDate.month > renewSettings.month || (hDate.month === renewSettings.month && hDate.day >= renewSettings.day)) {
                mainBalance += 36;
                lastMainRenewYear = hDate.year;
                leavesHistory = []; 
                changed = true;
            }
        }
        
        if (changed) await saveDataToCloud();
        updateUI();
    }

    function updateUI() {
        document.getElementById('mainBalanceDisplay').innerText = mainBalance;
        document.getElementById('scatBalanceDisplay').innerText = scatBalance;
        
        const tbody = document.getElementById('leaveTableBody');
        tbody.innerHTML = '';
        leavesHistory.forEach((leave, index) => {
            const typeLabel = leave.leaveType === 'hospital' ? 'مستشفى' : 'اعتيادية';
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${leave.startDate}</td>
                <td>${leave.dayName} <br><small style="color: #7f8c8d; font-size: 10px;">(${typeLabel})</small></td>
                <td>${leave.daysCount}</td>
                <td>${leave.returnDate}</td>
                <td>
                    <span class="action-icon" title="حذف" style="color: red;" onclick="deleteLeave(${index})">🗑️</span>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.submitLeave = async function() {
        const leaveType = document.getElementById('leaveTypeInput').value;
        const daysCount = parseInt(document.getElementById('leaveDays').value);
        
        if (!selectedDateObj || daysCount < 1) return alert("الرجاء تحديد تاريخ صحيح.");

        if (leaveType === 'normal') {
            if (daysCount >= 1 && daysCount <= 4) {
                if (daysCount > scatBalance) return alert(`مرفوض: لا يوجد رصيد كافي في الأيام المتفرقة (${scatBalance} يوم متاح).`);
                if (daysCount > mainBalance) return alert(`مرفوض: لا يوجد رصيد كافي في الأساسي (${mainBalance} يوم متاح).`);
                scatBalance -= daysCount;
                mainBalance -= daysCount;
            } else if (daysCount >= 5) {
                if (daysCount > mainBalance) return alert(`مرفوض: لا يوجد رصيد كافي في الأساسي (${mainBalance} يوم متاح).`);
                mainBalance -= daysCount;
            }
        } else if (leaveType === 'hospital') {
            if (daysCount > mainBalance) return alert(`مرفوض: لا يوجد رصيد كافي في الأساسي (${mainBalance} يوم متاح).`);
            mainBalance -= daysCount;
        }

        const daysAr = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        const dayName = daysAr[selectedDateObj.getDay()];
        
        const returnDateObj = new Date(selectedDateObj);
        returnDateObj.setDate(returnDateObj.getDate() + daysCount); 
        const returnDateStr = returnDateObj.toISOString().split('T')[0];

        const hFormatter = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { year: 'numeric', month: 'long', day: 'numeric' });
        const dateCombinedStr = hFormatter.format(selectedDateObj);

        leavesHistory.push({
            startDate: dateCombinedStr,
            dayName: dayName,
            daysCount: daysCount,
            returnDate: returnDateStr,
            leaveType: leaveType
        });

        toggleLeaveForm();
        updateUI();
        await saveDataToCloud();
        alert("تم رفع الإجازة بنجاح!");
    }

    window.deleteLeave = async function(index) {
        if(confirm("هل أنت متأكد من حذف هذه الإجازة واسترجاع الرصيد؟")) {
            const leave = leavesHistory[index];
            
            if (leave.leaveType === 'hospital') {
                mainBalance += leave.daysCount;
            } else {
                if (leave.daysCount >= 1 && leave.daysCount <= 4) {
                    scatBalance += leave.daysCount;
                    mainBalance += leave.daysCount;
                } else {
                    mainBalance += leave.daysCount;
                }
            }
            
            leavesHistory.splice(index, 1);
            updateUI();
            await saveDataToCloud();
        }
    }

    window.toggleLeaveForm = function() {
        const form = document.getElementById('leaveForm');
        form.style.display = form.style.display === 'block' ? 'none' : 'block';
    }

    // دالة toggleSettings المحدثة
    window.toggleSettings = function() {
        const setForm = document.getElementById('settingsForm');
        setForm.style.display = setForm.style.display === 'block' ? 'none' : 'block';
        
        // تعبئة القيم الحالية عند فتح لوحة الإعدادات
        document.getElementById('renewDay').value = renewSettings.day;
        document.getElementById('renewMonth').value = renewSettings.month;
        document.getElementById('manualMainBalance').value = mainBalance;
        document.getElementById('manualScatBalance').value = scatBalance;
    }

    // دالة saveSettings الشاملة المحدثة
    window.saveSettings = async function() {
        const d = document.getElementById('renewDay').value;
        const m = document.getElementById('renewMonth').value;
        const newMain = document.getElementById('manualMainBalance').value;
        const newScat = document.getElementById('manualScatBalance').value;
        
        // تحديث الأرصدة يدوياً إذا أدخلها المستخدم
        if (newMain !== '') mainBalance = Number(newMain);
        if (newScat !== '') scatBalance = Number(newScat);

        // تحديث تاريخ التجديد
        if (d && m) {
            renewSettings = { day: parseInt(d), month: parseInt(m) };
            
            const hDate = getTodayHijri();
            if (hDate.month < renewSettings.month || (hDate.month === renewSettings.month && hDate.day <= renewSettings.day)) {
                if (lastMainRenewYear === hDate.year) {
                    lastMainRenewYear = hDate.year - 1;
                }
            }
        }
        
        // حفظ البيانات في السحاب وتحديث الشاشة
        await saveDataToCloud();
        updateUI();
        alert("تم حفظ التعديلات بنجاح!");
        toggleSettings();
        checkRenewals(); 
    }

    window.logout = function() {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('currentUser');
        window.location.href = 'login.html';
    }

    window.startApp = function() {
        loadDataFromCloud();
    };

    if (window.isFirebaseReady) {
        window.startApp();
    }
</script>
</body>
</html>
