<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - نظام إدارة التصاريح</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f8fafc;
            padding: 20px;
        }

        /* شاشة التحميل */
        #loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loader-text {
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 500;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* محتوى الصفحة الفخم */
        .container {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
        }

        .container.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* رأس الصفحة: الرئيسية يمين وزر تسجيل الدخول يسار */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .page-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
        }

        .login-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .login-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.5);
        }

        .login-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* رسالة الترحيب */
        .welcome-msg {
            font-size: 0.95rem;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* زر الحاسبة */
        .action-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .action-btn:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div id="loader-screen">
        <div class="spinner"></div>
        <div class="loader-text">جاري التحميل...</div>
    </div>

    <!-- البطاقة الرئيسية -->
    <div class="container" id="main-content">
        <div class="page-header">
            <div class="page-title">الرئيسية</div>
            <a href="login.html" class="login-btn" title="تسجيل الدخول">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                </svg>
            </a>
        </div>
        
        <div class="welcome-msg">
            مرحباً بك في نظام إدارة التصاريح. الرجاء تسجيل الدخول للوصول للخدمات، أو استخدام الحاسبة للزوار.
        </div>
        
        <a href="calculator.html" class="action-btn">حاسبة وقت الخروج المتاحة ⏱️</a>
    </div>

    <script>
        // إخفاء شاشة التحميل بعد ثانيتين وإظهار الصفحة بتصميم فخم
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader-screen');
                const content = document.getElementById('main-content');
                
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    content.classList.add('show');
                }, 500);
            }, 2000); // 2000 ميللي ثانية = ثانيتين
        });
    </script>

</body>
</html>
